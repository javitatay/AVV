/* Iluminación en directo · aspecto AVV Lab: crema, tinta, pasteles planos con contorno grueso y sombra desplazada. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:#f7f6f3; --surface:#ffffff; --fg:#1f1d1a; --mid:#6f6b64; --line:#e6e2da;
  --stroke-c:#1f1d1a; --hover:rgba(31,29,26,.05); --focus:#1f1d1a;
  --blue:#cbe6f7; --yellow:#f2da8e; --green:#d5e7d0; --pink:#f5cfcd;
  --on-pastel:#1f1d1a; --on-pastel-2:#4a463f; --obj-stroke:#1f1d1a; --band-surface:#ffffff;
  --hi:#f2da8e; --hi-fg:#1f1d1a;
  --sh-mix:100%;
  --blue-d:color-mix(in srgb,var(--blue) var(--sh-mix),#000);
  --yellow-d:color-mix(in srgb,var(--yellow) var(--sh-mix),#000);
  --green-d:color-mix(in srgb,var(--green) var(--sh-mix),#000);
  --pink-d:color-mix(in srgb,var(--pink) var(--sh-mix),#000);
  --ill-s-b:#1f1d1a; --ill-s-y:#1f1d1a; --ill-s-g:#1f1d1a; --ill-s-p:#1f1d1a;
  --ill-f-b:var(--blue); --ill-f-y:var(--yellow); --ill-f-g:var(--green); --ill-f-p:var(--pink);
  --btn-bg:#1f1d1a; --btn-fg:#f7f6f3;
  --good:#2f6b3a; --bad:#a33a30;
  --stage:#0a0c13;
  --radius:16px; --offset:8px; --max:1240px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1b1917; --surface:#262320; --fg:#f7f6f3; --mid:#b3aea4; --line:#38342f;
  --stroke-c:#a9a499; --hover:rgba(247,246,243,.07); --focus:#f7f6f3;
  --btn-bg:var(--yellow); --btn-fg:#1f1d1a; --sh-mix:52%;
  --ill-s-b:var(--blue); --ill-s-y:var(--yellow); --ill-s-g:var(--green); --ill-s-p:var(--pink);
  --ill-f-b:var(--blue-d); --ill-f-y:var(--yellow-d); --ill-f-g:var(--green-d); --ill-f-p:var(--pink-d);
  --good:#8fd39a; --bad:#ff9d90;
  color-scheme:dark;
}
@supports (color: oklch(from red l c h)){
  :root[data-theme="dark"]{
    --blue-d:oklch(from var(--blue) calc(l * .70) calc(c * 2.0) h);
    --yellow-d:oklch(from var(--yellow) calc(l * .70) calc(c * 2.0) h);
    --green-d:oklch(from var(--green) calc(l * .70) calc(c * 2.0) h);
    --pink-d:oklch(from var(--pink) calc(l * .70) calc(c * 2.0) h);
  }
  :root[data-theme="dark"] .card{--tint-d:oklch(from var(--tint) calc(l * .70) calc(c * 2.0) h)}
}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .hero-stat{border-color:var(--tint)}

/* Lo que va sobre un pastel usa tinta oscura en claro y en oscuro */
.card-top,.card-ud,.card-btn,.hero-stat,.topbar-badge,.opt[aria-pressed="true"],.tabs button[aria-selected="true"],.read.hot,.skip-link,.side a[aria-current="page"],.kicker,.exercise .tag,.widget .wtag,.card .ok{
  --fg:var(--on-pastel); --mid:var(--on-pastel-2); --surface:var(--band-surface); --stroke-c:var(--obj-stroke); --focus:var(--on-pastel); color:var(--fg);
}

html{scroll-behavior:smooth}
body{font-family:var(--font);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.6;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
::selection{background:var(--hi);color:var(--hi-fg)}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
strong{font-weight:700}
a{color:var(--fg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono)}

/* ---------- Barra superior ---------- */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,calc((100% - var(--max))/2 + 16px));min-height:64px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);flex-shrink:1;min-width:0}
.brand>span:last-child{min-width:0}
.brand-logo{width:44px;height:37px;flex-shrink:0}
.brand-logo svg{display:block;width:100%;height:100%;overflow:visible}
.brand-name{font-family:var(--font-display);font-size:1.25rem;font-weight:800;letter-spacing:-.025em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:var(--mid);margin-top:2px;white-space:nowrap}
.topnav{display:flex;gap:6px;margin-left:10px}
.topnav a{font-size:13.5px;font-weight:700;text-decoration:none;padding:5px 14px;border-radius:999px;border:2px solid transparent;transition:background-color 150ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){.topnav a:hover{background:var(--hover)}}
.topnav a[aria-current="page"]{background:var(--yellow);color:var(--on-pastel);border-color:var(--obj-stroke)}
.spacer{flex:1}
.topbar-badge{font-size:12px;font-weight:700;color:var(--fg);background:var(--yellow);border:2px solid var(--stroke-c);border-radius:999px;padding:2px 12px;white-space:nowrap}
.menu-btn,.home-btn,.theme-toggle,.pill{flex-shrink:0}
.pill{font-family:var(--font-mono);font-size:12.5px;font-weight:700;padding:3px 12px;border:2px solid var(--stroke-c);border-radius:999px;background:var(--surface);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu-btn,.theme-toggle,.home-btn{height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--fg);border:2px solid var(--stroke-c);border-radius:12px;box-shadow:3px 3px 0 var(--blue-d);font-weight:700;font-size:14px;padding:0 12px;transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out);touch-action:manipulation}
.theme-toggle{width:40px;padding:0;box-shadow:3px 3px 0 var(--yellow-d)}
.home-btn{display:none;width:40px;padding:0;text-decoration:none;box-shadow:3px 3px 0 var(--green-d)}
.theme-toggle[hidden]{display:none}
.theme-toggle::before{content:"";width:18px;height:18px;border:2px solid var(--fg);border-radius:50%;background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)}
@media (hover:hover) and (pointer:fine){.menu-btn:hover,.theme-toggle:hover,.home-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--blue-d)}.theme-toggle:hover{box-shadow:5px 5px 0 var(--yellow-d)}.home-btn:hover{box-shadow:5px 5px 0 var(--green-d)}}
.menu-btn:active,.theme-toggle:active,.home-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stroke-c)}
.skip-link{position:absolute;top:-56px;left:12px;z-index:1000;background:var(--yellow);color:var(--on-pastel);border:2px solid var(--obj-stroke);text-decoration:none;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:top 150ms var(--ease-out)}
.skip-link:focus{top:12px}

/* ---------- Índice (cajón) ---------- */
.side{position:fixed;top:64px;bottom:0;left:0;z-index:30;width:min(360px,92vw);overflow:auto;padding:18px 14px 32px 16px;background:var(--bg);border-right:2px solid var(--stroke-c);transform:translateX(-102%);transition:transform .2s var(--ease-out)}
body.menu-open .side{transform:none;box-shadow:8px 0 0 var(--blue-d)}
.scrim{position:fixed;inset:64px 0 0 0;z-index:25;background:rgba(20,18,16,.55);backdrop-filter:blur(3px);display:none}
body.menu-open .scrim{display:block}
.side h3{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mid);margin:20px 8px 8px}
.side h3:first-child{margin-top:0}
.side a.side-home{margin-bottom:14px;padding:8px 12px;border:2px solid var(--stroke-c);border-radius:999px;font-weight:700;font-size:14px;background:var(--surface);box-shadow:3px 3px 0 var(--green-d);align-items:center}
.side a.side-home svg{flex:none}
.side a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:10px;border:2px solid transparent;text-decoration:none;font-size:14.5px;font-weight:500;line-height:1.35}
@media (hover:hover) and (pointer:fine){.side a:hover{background:var(--hover)}}
.side a[aria-current="page"]{background:var(--yellow);border-color:var(--obj-stroke);font-weight:700}
.side .num{font-family:var(--font-mono);font-size:12px;color:var(--mid);min-width:1.7em;font-variant-numeric:tabular-nums}
.side .tick{margin-left:auto;color:var(--good);font-weight:700}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:12px;border:2px solid var(--stroke-c);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;font-weight:700;font-size:14px;box-shadow:4px 4px 0 var(--blue-d);transition:transform 110ms var(--ease-out),box-shadow 110ms var(--ease-out);touch-action:manipulation}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:4px 4px 0 var(--yellow-d)}
.btn.primary{--fg:var(--btn-fg)}
.btn.small{padding:5px 13px;font-size:13px;box-shadow:3px 3px 0 var(--blue-d)}
.btn.small.primary{box-shadow:3px 3px 0 var(--yellow-d)}
@media (hover:hover) and (pointer:fine){.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--blue-d)}.btn.primary:hover{box-shadow:6px 6px 0 var(--yellow-d)}.btn.small:hover{box-shadow:4px 4px 0 var(--blue-d)}.btn.small.primary:hover{box-shadow:4px 4px 0 var(--yellow-d)}}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--stroke-c)}
.btn[aria-pressed="true"]{background:var(--green);--fg:var(--on-pastel);color:var(--on-pastel);border-color:var(--obj-stroke)}

/* ---------- Inicio ---------- */
.hero{max-width:var(--max);margin:0 auto;padding:44px 32px 52px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:48px;align-items:center;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.1rem);line-height:.98;letter-spacing:-.035em;margin-bottom:18px}
.hero h1 em{font-style:normal;text-decoration:underline;text-decoration-color:var(--hi);text-decoration-thickness:.11em;text-underline-offset:.1em;text-decoration-skip-ink:none}
.hero-sub{font-size:1.05rem;color:var(--mid);max-width:50ch;margin-bottom:24px}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin-bottom:28px}
.hero-stat{--tint:var(--blue);display:flex;align-items:baseline;gap:6px;background:var(--tint);color:var(--fg);border:2px solid var(--stroke-c);border-radius:999px;padding:3px 14px}
.hero-stats .hero-stat:nth-child(2){--tint:var(--yellow)}.hero-stats .hero-stat:nth-child(3){--tint:var(--green)}.hero-stats .hero-stat:nth-child(4){--tint:var(--pink)}
.hero-stat-n{font-family:var(--font-display);font-size:1.3rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-stat-l{font-size:.85rem;font-weight:600}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px}
.frame{position:relative;border:2px solid var(--stroke-c);border-radius:var(--radius);overflow:hidden;background:#05060a;box-shadow:var(--offset) var(--offset) 0 var(--blue-d)}
.hero-art{aspect-ratio:4/3.1;width:100%}
.hero-art .viewer{position:absolute;inset:0;height:100%;border:0;border-radius:0}
.hero-fallback{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg)}
.hero-fallback svg{width:60%;height:auto;overflow:visible}

.section-header{max-width:var(--max);margin:0 auto;padding:40px 32px 22px;display:flex;align-items:center;gap:16px}
.section-title{font-family:var(--font-display);font-size:1.65rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.section-sub{font-size:13.5px;color:var(--mid);white-space:nowrap}
.section-line{flex:1;height:0;border-top:2px dashed var(--line)}
.grid{max-width:var(--max);margin:0 auto;padding:0 40px 24px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 26px}
.card{--tint:var(--blue);--tint-d:color-mix(in srgb,var(--tint) var(--sh-mix),#000);position:relative;background:var(--surface);color:var(--fg);border:2px solid var(--stroke-c);border-radius:var(--radius);text-decoration:none;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--offset) var(--offset) 0 var(--tint-d);transition:transform 140ms var(--ease-out),box-shadow 140ms var(--ease-out);animation:rise 420ms var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (hover:hover) and (pointer:fine){.card:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 var(--tint-d)}}
.card:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--tint-d)}
.card.t2{--tint:var(--yellow)}.card.t3{--tint:var(--green)}.card.t4{--tint:var(--pink)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--tint);border-bottom:2px solid var(--stroke-c)}
.card-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:2px solid var(--stroke-c);border-radius:12px;font-size:1.35rem;line-height:1}
.card-ud{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--surface);border:2px solid var(--stroke-c);border-radius:6px;padding:1px 8px;transform:rotate(-2deg);white-space:nowrap}
.card-body{padding:14px 18px 8px;flex:1}
.card-title{font-family:var(--font-display);font-size:1.22rem;font-weight:800;letter-spacing:-.02em;line-height:1.12}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 18px;padding:12px 0 16px;border-top:2px dashed var(--line)}
.card-tag{font-size:12px;font-weight:600;padding:0 9px;border-radius:999px;color:var(--mid);border:1.5px solid var(--line)}
.card-tag.on{color:var(--fg);border-color:var(--stroke-c)}
.card-btn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;background:var(--tint);color:var(--fg);border:2px solid var(--stroke-c);border-radius:999px;padding:1px 12px;transition:gap 140ms var(--ease-out)}
.card:hover .card-btn{gap:9px}
.card .ok{position:absolute;right:-2px;top:-2px;z-index:2;background:var(--green);color:var(--on-pastel);border:2px solid var(--obj-stroke);border-radius:0 0 0 10px;padding:0 9px;font-weight:800;font-size:13px}
.footer{text-align:center;padding:30px 32px 36px;font-size:13px;color:var(--mid);border-top:1px solid var(--line);margin-top:40px}
.footer p+p{margin-top:3px}.footer strong{color:var(--fg)}.footer a{font-weight:700}

/* ---------- Visor 3D ---------- */
.viewer{position:relative;background:#05060a;overflow:hidden;touch-action:none;min-height:260px}
.viewer canvas{display:block;width:100%;height:100%;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.hud{position:absolute;left:14px;top:14px;display:grid;gap:2px;color:#fff;pointer-events:none;text-shadow:0 1px 8px #000;max-width:72%}
.hud b{font-family:var(--font-display);font-size:clamp(1.1rem,2.6vw,1.6rem);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.hud span{font-size:.88rem;color:#cfd5e6}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:.76rem;color:#c5cce0;background:#000a;padding:4px 12px;border-radius:999px;pointer-events:none;white-space:normal;text-align:center;max-width:92%;transition:opacity .6s}
.vbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.vbtns button{width:36px;height:36px;border-radius:50%;border:2px solid #ffffff55;background:#0a0c13d0;color:#fff;cursor:pointer;font-size:1rem}
.vbtns button:hover{border-color:var(--yellow)}
.nogl{padding:18px}

/* ---------- Lección ---------- */
.lpage{max-width:var(--max);margin:0 auto;padding:24px 32px 60px}
.lhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:22px}
.lhead h1{font-size:clamp(1.55rem,3.4vw,2.3rem)}
.kicker{font-family:var(--font-mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--yellow);color:var(--fg);border:2px solid var(--stroke-c);border-radius:6px;padding:1px 9px;transform:rotate(-2deg);white-space:nowrap;display:inline-block}
.lgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(310px,1fr);gap:30px;align-items:start}
.lgrid .viewer{height:clamp(320px,64vh,680px);border:2px solid var(--stroke-c);border-radius:var(--radius);box-shadow:var(--offset) var(--offset) 0 var(--blue-d)}
.lmain{display:grid;gap:26px;min-width:0}
.dock{background:var(--surface);border:2px solid var(--stroke-c);border-radius:var(--radius);box-shadow:var(--offset) var(--offset) 0 var(--yellow-d);overflow:hidden;min-width:0;position:sticky;top:78px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-bottom:2px dashed var(--line)}
.tabs button{font-size:12.5px;font-weight:700;padding:3px 14px;border-radius:999px;cursor:pointer;border:2px solid var(--stroke-c);background:var(--surface);transition:transform 100ms var(--ease-out),background-color 150ms var(--ease-out);touch-action:manipulation}
@media (hover:hover) and (pointer:fine){.tabs button[aria-selected="false"]:hover{background:var(--blue);color:var(--on-pastel);border-color:var(--obj-stroke)}}
.tabs button:active{transform:scale(.96)}
.tabs button[aria-selected="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--yellow-d)}
.pane{padding:16px;overflow:auto;min-height:0}
.keys{list-style:none;display:grid;gap:14px}
.keys li{display:flex;gap:12px;align-items:flex-start;font-size:1.02rem;line-height:1.45;font-weight:500}
.keys li::before{content:"";flex:none;width:16px;height:16px;margin-top:.28em;border-radius:50%;border:2px solid var(--stroke-c);background:var(--blue)}
.keys li:nth-child(2)::before{background:var(--yellow)}.keys li:nth-child(3)::before{background:var(--green)}.keys li:nth-child(4)::before{background:var(--pink)}
.lede2{color:var(--mid);margin:0 0 16px;font-size:.95rem}
.dockfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px;border-top:2px dashed var(--line)}
.extras{display:grid;gap:26px}
.pane .prose{max-width:none;font-size:.95rem}
.pane .prose h2{font-size:1.2rem;margin:24px 0 8px}
.pane .quiz{margin:0;border:0;padding:0}
.pane .reads{grid-template-columns:repeat(2,1fr)}

/* ---------- Texto de apuntes ---------- */
.prose{max-width:68ch}
.prose h2{font-size:1.4rem;margin:32px 0 10px}
.prose h3{font-size:1.1rem;margin:22px 0 6px}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 14px;padding-left:1.2em}.prose li{margin:3px 0}
.callout{border:2px solid var(--stroke-c);border-left-width:8px;background:color-mix(in srgb,var(--yellow) 32%,var(--surface));padding:12px 16px;border-radius:12px;margin:18px 0}
.callout.cool{background:color-mix(in srgb,var(--blue) 40%,var(--surface))}
.callout p{margin:0}
.tbl-wrap{overflow-x:auto;margin:14px 0 20px;border:2px solid var(--stroke-c);border-radius:12px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--blue);color:var(--on-pastel);font-weight:700;font-size:.8rem;letter-spacing:.02em;border-bottom:2px solid var(--stroke-c)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:700}
.formula{font-family:var(--font-mono);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;display:block;overflow-x:auto}
.exercise{border:2px dashed var(--stroke-c);border-radius:12px;padding:14px 18px;margin:22px 0;background:var(--surface)}
.exercise .tag{font-family:var(--font-mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--green);color:var(--on-pastel);border:2px solid var(--obj-stroke);border-radius:6px;padding:0 8px}
.exercise p{margin:8px 0 0}.exercise ul,.exercise ol{margin:6px 0 0;padding-left:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:3px 14px;border:2px solid var(--stroke-c);border-radius:999px;background:var(--surface);font-size:.9rem;font-weight:600}
.chip:nth-child(4n+1){background:var(--blue);color:var(--on-pastel)}.chip:nth-child(4n+2){background:var(--yellow);color:var(--on-pastel)}.chip:nth-child(4n+3){background:var(--green);color:var(--on-pastel)}.chip:nth-child(4n){background:var(--pink);color:var(--on-pastel)}

/* ---------- Simuladores y controles ---------- */
.widget{border:2px solid var(--stroke-c);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--offset) var(--offset) 0 var(--blue-d)}
.widget>header{padding:16px 20px 0}
.widget .wtag{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--blue);color:var(--on-pastel);border:2px solid var(--obj-stroke);border-radius:6px;padding:0 8px;transform:rotate(-2deg);margin-bottom:8px}
.widget h3{font-size:1.25rem;margin:2px 0 4px}
.widget .wnote{margin:0 0 6px;color:var(--mid);font-size:.92rem}
.wbody{padding:12px 20px 20px;display:grid;gap:14px}
.pane .widget{border:0;box-shadow:none}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 24px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:.88rem}
.ctl-l{color:var(--mid);font-weight:500}
.ctl-o{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:.85rem;text-align:right}
.ctl input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:var(--bg);border:2px solid var(--stroke-c)}
input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:var(--bg);border:2px solid var(--stroke-c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--yellow);border:2px solid var(--obj-stroke);box-shadow:2px 2px 0 var(--obj-stroke)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--yellow);border:2px solid var(--obj-stroke);box-shadow:2px 2px 0 var(--obj-stroke)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-size:13px;font-weight:700;padding:3px 14px;border-radius:999px;cursor:pointer;border:2px solid var(--stroke-c);background:var(--surface);transition:transform 100ms var(--ease-out),background-color 150ms var(--ease-out);touch-action:manipulation}
@media (hover:hover) and (pointer:fine){.opt[aria-pressed="false"]:hover,.opt:not([aria-pressed]):hover{background:var(--blue);color:var(--on-pastel);border-color:var(--obj-stroke)}}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--yellow-d)}
.stage{background:var(--stage);color:#e8ebf4;border:2px solid var(--stroke-c);border-radius:12px;overflow:hidden;position:relative}
.stage canvas,.stage svg{display:block;width:100%;height:auto}
.stage .cap{padding:8px 12px;font-size:.82rem;color:#8d97ad;border-top:1px solid #1d2230}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.read{background:var(--surface);border:2px solid var(--stroke-c);border-radius:12px;padding:7px 12px;box-shadow:3px 3px 0 var(--blue-d)}
.read b{display:block;font-family:var(--font-mono);font-size:1.12rem;font-weight:700;font-variant-numeric:tabular-nums}
.read span{font-size:.76rem;color:var(--mid);font-weight:500}
.read.hot{background:var(--yellow);box-shadow:3px 3px 0 var(--yellow-d)}
.read.txt{grid-column:1/-1}
.read.txt b{font-family:var(--font);font-size:.98rem;font-weight:700;line-height:1.4}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;font-size:.86rem;font-weight:500}
.barrow .track{height:16px;background:var(--bg);border:2px solid var(--stroke-c);border-radius:999px;overflow:hidden}
.barrow .fill{height:100%;background:var(--yellow);border-right:2px solid var(--obj-stroke);transition:width .15s}
.barrow .fill.cool{background:var(--blue)}
.barrow .val{font-family:var(--font-mono);font-weight:700;font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:.84rem;color:var(--mid);margin:0}
.swatch{height:90px;border-radius:12px;border:2px solid var(--stroke-c)}
.specbar{position:relative;height:46px;border-radius:10px;border:2px solid var(--stroke-c)}
.specbar .mark{position:absolute;top:-8px;bottom:-8px;width:4px;background:#fff;box-shadow:0 0 0 2px #000;border-radius:2px}
.specscale{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.74rem;color:var(--mid)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:.9rem}
.dl dt{color:var(--mid);font-weight:600}.dl dd{margin:0}
input[type=number],select,input[type=text]{font:inherit;padding:6px 10px;border:2px solid var(--stroke-c);border-radius:10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=number]{width:96px;font-family:var(--font-mono)}
.dmxtbl{font-family:var(--font-mono);font-size:.82rem}.dmxtbl td:first-child{font-weight:700}
.dip{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:44px;border:2px solid var(--stroke-c);border-radius:10px;background:var(--surface);padding:6px 0 4px;cursor:pointer;display:grid;gap:4px;justify-items:center;font-family:var(--font-mono);font-size:.72rem;font-weight:700}
.sw i{display:block;width:22px;height:30px;border-radius:4px;background:var(--stage);position:relative}
.sw i::after{content:"";position:absolute;left:3px;right:3px;height:12px;border-radius:2px;background:#8d97ad;top:15px;transition:top .1s}
.sw[aria-pressed="true"] i::after{top:3px;background:var(--yellow)}
.bits{display:flex;gap:4px}
.bits span{width:26px;text-align:center;font-family:var(--font-mono);font-weight:700;padding:4px 0;border-radius:6px;background:var(--bg);border:2px solid var(--line)}
.bits span.on{background:var(--blue);color:var(--on-pastel);border-color:var(--obj-stroke)}
.check{display:grid;gap:10px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--stroke-c);border-radius:12px;cursor:pointer;background:var(--surface)}
.check input{margin-top:4px;accent-color:var(--good);width:18px;height:18px;flex:none}
.check label:has(input:checked){background:var(--green);color:var(--on-pastel);border-color:var(--obj-stroke)}
.progress{height:14px;background:var(--bg);border:2px solid var(--stroke-c);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--green);border-right:2px solid var(--obj-stroke);transition:width .2s}
.rowed{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 36px;gap:8px;align-items:center}
.rowed input[type=number]{width:100%}
.x{border:2px solid var(--stroke-c);background:var(--surface);border-radius:10px;cursor:pointer;height:34px;font-weight:700}
.x:hover{background:var(--pink);color:var(--on-pastel)}
.frow{display:grid;grid-template-columns:54px 1fr 34px;gap:8px;align-items:center;font-size:.8rem;padding:3px 0}
.frow .own{grid-column:1/-1;font-size:.74rem;color:var(--mid);margin:-4px 0 2px 62px}
.frow .own.bad{color:var(--bad);font-weight:700}

/* ---------- Cuestionario ---------- */
.quiz{margin:36px 0 0;border-top:2px solid var(--stroke-c);padding-top:18px}
.q{margin:16px 0;padding:14px 16px;border:2px solid var(--stroke-c);border-radius:12px;background:var(--surface);box-shadow:4px 4px 0 var(--blue-d)}
.q p{margin:0 0 10px;font-weight:700}
.q .answers{display:grid;gap:8px}
.q button.a{text-align:left;padding:8px 12px;border:2px solid var(--stroke-c);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500}
@media (hover:hover) and (pointer:fine){.q button.a:hover:not(:disabled){background:var(--blue);color:var(--on-pastel);border-color:var(--obj-stroke)}}
.q button.a.ok{background:var(--green);color:var(--on-pastel);border-color:var(--obj-stroke);font-weight:700}
.q button.a.no{background:var(--pink);color:var(--on-pastel);border-color:var(--obj-stroke)}
.q .why{margin:10px 0 0;font-size:.9rem;color:var(--mid);font-weight:400}
.score{font-family:var(--font-mono);font-weight:700;font-size:.9rem}

/* ---------- Compat. y móvil ---------- */
.compo{max-width:var(--max);margin:0 auto;padding:24px 32px 60px}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:28px;padding:28px 18px 40px}
  .hero-art{order:-1;aspect-ratio:4/3}
  .grid,.section-header,.lpage,.compo{padding-left:18px;padding-right:22px}
  .lgrid{grid-template-columns:1fr}
  .lgrid .viewer{height:min(52vh,460px)}
  .dock{position:static;max-height:none}
  .topnav,.topbar-badge,.brand-sub{display:none}
  .home-btn{display:inline-flex}
  .barrow{grid-template-columns:84px 1fr 86px}
  .rowed{grid-template-columns:minmax(0,1fr) 70px 70px 36px}
  .section-sub{display:none}
}
@media (max-width:560px){
  .topbar{gap:8px}
  .menu-btn .mt{display:none}
  .brand-name{font-size:1rem;white-space:normal;overflow:visible}
  .brand-sub{display:none}
  .brand-logo{width:36px;height:30px}
  .pill{font-size:12px;padding:2px 9px}
}

/* ── Simuladores del curso de imagen y vídeo ── */
.expo{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.expo svg{width:120px;height:120px}
.expo-photo{position:relative;height:120px;border:2px solid var(--stroke-c);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#6f8fb8 0 55%,#3c4a3a 55% 100%)}
.expo-photo span{position:absolute;inset:0;background:radial-gradient(circle at 78% 30%,#ffe9a8 0 9px,transparent 10px),linear-gradient(90deg,transparent 0 12%,#28402c 12% 20%,transparent 20% 30%,#2f4a33 30% 36%,transparent 36%);opacity:.9}
.expo-photo i{position:absolute;left:44%;bottom:14%;width:22px;height:56px;border-radius:11px 11px 4px 4px;background:#e9e9ee}
.expo-photo::after{content:"";position:absolute;inset:0;opacity:var(--noise,0);background-image:repeating-conic-gradient(#fff 0 25%,#000 0 50%);background-size:3px 3px;mix-blend-mode:overlay}
.dof-scene{position:relative;height:190px;border:2px solid var(--stroke-c);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#27304a 0 58%,#1a1f2c 58% 100%)}
.dof-p{position:absolute;bottom:14px;width:calc(64px*var(--s));transform:translateX(-50%);text-align:center;color:#8d97ad}
.dof-p svg{display:block;width:100%;height:auto;fill:#cfd5e6}
.dof-p.sharp svg{fill:#b9e0b0}
.dof-p small{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:10px;font-family:var(--font-mono);white-space:nowrap;line-height:1.2}
.dof-bar{position:relative;height:26px;margin:0 2px 16px;border:2px solid var(--stroke-c);border-radius:999px;background:var(--bg)}
.dof-zone{position:absolute;top:0;bottom:0;background:var(--green);border-inline:2px solid var(--obj-stroke)}
.dof-focus{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:var(--yellow);border:1px solid var(--obj-stroke);border-radius:2px}
.dof-bar i{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--fg)}
.dof-bar span{position:absolute;top:100%;font-size:10.5px;font-family:var(--font-mono);color:var(--mid);margin-top:3px}
.key-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.key-grid figure{margin:0}
.key-grid canvas{display:block;width:100%;height:auto;border:2px solid var(--stroke-c);border-radius:10px;background:#000}
.key-grid figcaption{font-size:.76rem;color:var(--mid);margin-top:4px;font-weight:500}
.beatrow{display:flex;align-items:center;gap:12px}
.beat{width:26px;height:26px;border-radius:50%;background:var(--pink);border:2px solid var(--obj-stroke);animation:beatpulse 1s infinite cubic-bezier(.2,.8,.2,1)}
@keyframes beatpulse{0%{transform:scale(1.35);background:var(--yellow)}35%{transform:scale(1)}100%{transform:scale(1)}}
.gop{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.gop button{font-family:var(--font-mono);font-weight:700;font-size:12px;padding:8px 0;border:2px solid var(--stroke-c);border-radius:8px;background:var(--blue);color:var(--on-pastel);cursor:pointer;touch-action:manipulation}
.gop button.p{background:var(--surface);color:var(--fg)}
.gop button.need{background:var(--pink);color:var(--on-pastel)}
.gop button.on{background:var(--yellow);color:var(--on-pastel);box-shadow:2px 2px 0 var(--yellow-d)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{border:2px solid var(--stroke-c);border-radius:10px;padding:6px 8px;background:var(--surface);opacity:.45;min-width:0}
.step b{display:block;font-size:.82rem}.step span{font-size:.7rem;font-family:var(--font-mono);color:var(--mid)}
.step.ok{opacity:1;background:var(--green);color:var(--on-pastel)}.step.ok span,.step.on span{color:var(--on-pastel-2,#3a3a3a)}
.step.on{opacity:1;background:var(--yellow);color:var(--on-pastel);box-shadow:3px 3px 0 var(--yellow-d)}
.fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.fmts span{font-family:var(--font-mono);font-weight:700;text-align:center;padding:10px 4px;border:2px solid var(--stroke-c);border-radius:10px;background:var(--green);color:var(--on-pastel);transition:opacity .15s,background-color .15s}
.fmts span.off{background:var(--surface);color:var(--mid);opacity:.4}
.lanes{display:grid;gap:8px}
.lane{position:relative;height:34px;border:2px solid var(--stroke-c);border-radius:999px;background:var(--bg);overflow:hidden}
.lane span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.76rem;color:var(--mid);font-weight:600}
.lane i{position:absolute;top:4px;left:0;width:22px;height:22px;border-radius:50%;background:var(--yellow);border:2px solid var(--obj-stroke);animation:lanemove 1.2s linear infinite}
.lane+.lane i{background:var(--blue)}
@keyframes lanemove{from{left:-24px}to{left:100%}}
.oklist{display:grid;gap:6px}
.okrow{display:grid;grid-template-columns:26px 1fr;gap:0 8px;align-items:center;padding:6px 12px;border:2px solid var(--stroke-c);border-radius:10px;background:var(--surface);font-size:.9rem;font-weight:600}
.okrow b{grid-row:span 2;font-size:1.05rem}
.okrow small{grid-column:2;font-weight:500;color:var(--mid);font-size:.76rem}
.okrow.ok{background:var(--green);color:var(--on-pastel)}.okrow.ok small{color:var(--on-pastel)}
.okrow.no{opacity:.5}
.mix-mons{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mix-mons small{display:block;margin-top:5px;font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--mid)}
.mon{position:relative;aspect-ratio:16/9;border:3px solid #3fae5a;border-radius:10px;overflow:hidden;background:#000}
.mon.pgm{border-color:#d9483b}
.mon span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:clamp(1rem,3vw,1.5rem);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.mtx{display:grid;gap:6px;align-items:center}
.mtx .mh{font-size:.72rem;font-weight:700;text-align:center;color:var(--mid);line-height:1.15}
.mtx .mi,.mtx .mo{font-size:.78rem;font-weight:700;padding:6px 8px;border:2px solid var(--obj-stroke);border-radius:8px;color:var(--on-pastel);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{justify-self:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--stroke-c);background:var(--bg);cursor:pointer;padding:0;touch-action:manipulation}
.xp.on{background:var(--fg);box-shadow:0 0 0 4px var(--yellow)}
.xp:disabled{cursor:default}
.testimg{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:4px;overflow:hidden;background:linear-gradient(90deg,#fff 0 14.28%,#f2e04a 0 28.57%,#4ad9e0 0 42.85%,#4ad95a 0 57.14%,#d94ad0 0 71.42%,#e0483e 0 85.71%,#3e55e0 0)}
.testimg::before{content:"";position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(90deg,#000,#fff)}
.testimg::after{content:"";position:absolute;inset:0;background:#cfd3dc;opacity:var(--wash,0)}
@media (max-width:560px){.expo{grid-template-columns:90px 1fr}.expo svg{width:90px;height:90px}.key-grid{grid-template-columns:1fr 1fr}.key-grid figure:first-child{display:none}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.gop{gap:2px}.gop button{font-size:10px;border-width:1px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){.brand .brand-sub{display:none!important}}

<script>
const LOGO_SVG = '<svg viewBox="-4 -4 410 342" role="presentation" focusable="false"><g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="16"><g style="stroke:var(--ill-s-b)"><rect x="13" y="13" width="387" height="203" rx="22" style="fill:var(--ill-f-b)" stroke="none"/><rect x="0" y="0" width="387" height="203" rx="22"/></g><g style="stroke:var(--ill-s-y)"><path d="M206 60L128 176L284 176Z" style="fill:var(--ill-f-y)" stroke="none" transform="translate(13 13)"/><path d="M193 47L115 163L271 163Z"/><circle cx="193" cy="34" r="14" style="fill:var(--ill-f-y)"/></g><g style="stroke:var(--ill-s-y)"><rect x="13" y="248" width="120" height="85" rx="15" style="fill:var(--ill-f-y)" stroke="none"/><rect x="0" y="236" width="120" height="85" rx="15"/></g><g style="stroke:var(--ill-s-g)"><rect x="147" y="248" width="120" height="85" rx="15" style="fill:var(--ill-f-g)" stroke="none"/><rect x="134" y="236" width="120" height="85" rx="15"/></g><g style="stroke:var(--ill-s-p)"><rect x="280" y="248" width="120" height="85" rx="15" style="fill:var(--ill-f-p)" stroke="none"/><rect x="267" y="236" width="120" height="85" rx="15"/></g></g></svg>';
/* ============================================================
   CONTENIDO DEL CURSO · Imagen y vídeo (UD 1, 2 y 3)
   Para añadir una lección: copia un bloque de LESSONS, cambia el número,
   el título y el HTML de "body". Cada simulador se declara en "widgets"
   con el nombre de una función de WIDGETS (widgets.js).
   ============================================================ */

const UNITS = {
  1: { title: 'Unidad 1 · La imagen', sub: 'Resolución, óptica, exposición, alfa y loops' },
  2: { title: 'Unidad 2 · La señal', sub: 'Conectores, formatos, códecs y equipos de vídeo' },
  3: { title: 'Unidad 3 · Proyección, LED y mapping', sub: 'Proyectores, pantallas LED, blending y pixel mapping' }
};

const tbl = (head, rows) =>
  `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows
    .map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`)
    .join('')}</tbody></table></div>`;

const exercise = (id, html) => `<div class="exercise"><span class="tag">Ejercicio ${id}</span>${html}</div>`;
const W = (key, title, note) => ({ key, title, note });

const LESSONS = [
/* ───────────── UNIDAD 1 ───────────── */
{
  n: 1, unit: 1, title: 'Resolución',
  lede: 'Cuántos píxeles tiene una imagen y por qué el alto le da nombre.',
  body: `
<h2>Qué es la resolución</h2>
<ul>
<li>Cantidad de información que podemos mostrar en una superficie: el número de píxeles.</li>
<li>Se expresa como <strong>ancho × alto</strong> (horizontal × vertical).</li>
<li>El <strong>alto</strong> da el nombre habitual: 1080p, 720p…</li>
</ul>
<h2>Las más comunes</h2>
${tbl(['Nombre', 'Resolución', 'Píxeles'], [
  ['2160p (4K / UHD)', '3840 × 2160', '8.294.400'],
  ['1440p (2K / QHD)', '2560 × 1440', '3.686.400'],
  ['1080p (Full HD)', '1920 × 1080', '2.073.600'],
  ['720p (HD Ready)', '1280 × 720', '921.600'],
  ['SD', '720 × 576 (PAL) · 720 × 480 (NTSC)', 'píxel no cuadrado']
])}
<div class="callout"><p>Cada salto duplica ancho y alto: de Full HD a 4K hay <strong>cuatro veces</strong> más píxeles, no el doble.</p></div>`,
  after: exercise('1.1', `<p>¿Cuál es la resolución de nuestro teléfono móvil? ¿A qué relación de aspecto corresponde?</p>`) +
    exercise('1.2', `<p>Tenemos un vídeo a una resolución UHD-1 y necesitamos reducirlo a la siguiente resolución inferior conservando la relación de aspecto. ¿Cuál es la resolución inferior que conserva esa relación de aspecto?</p>`) +
    exercise('1.6', `<p>Una cámara graba a 3840×2160 (4K). Si queremos escalar el vídeo manteniendo la misma relación de aspecto pero con un ancho de 1920 px, ¿cuál sería el alto resultante?</p>`),
  widgets: [W('resolucion', 'Compara resoluciones', 'Elige dos resoluciones y mira cuánto ocupa una dentro de la otra y cuántos píxeles tiene cada una.')],
  quiz: [
    { q: '¿Cómo se expresa una resolución?', o: ['Alto × ancho', 'Ancho × alto', 'Diagonal en pulgadas', 'Píxeles por pulgada'], a: 1, why: 'Siempre horizontal × vertical: 1920 × 1080.' },
    { q: '¿Cuántos píxeles tiene una imagen Full HD?', o: ['921.600', '2.073.600', '3.686.400', '8.294.400'], a: 1, why: '1920 × 1080 = 2.073.600 píxeles.' },
    { q: '¿Cuántas veces más píxeles tiene 4K (3840 × 2160) que Full HD?', o: ['2', '3', '4', '8'], a: 2, why: 'Se duplican ancho y alto: 2 × 2 = 4 veces más.' }
  ]
},
{
  n: 2, unit: 1, title: 'Relación de aspecto (DAR)',
  lede: 'La forma de la imagen: cuánto ancho hay por cada unidad de alto.',
  body: `
<h2>Qué es</h2>
<ul>
<li>Relación proporcional entre el <strong>ancho y el alto</strong> físicos de la superficie.</li>
<li>Se escribe con dos números separados por «:» → <strong>anchura : altura</strong>.</li>
<li>16:9 significa 16 unidades de ancho por cada 9 de alto.</li>
</ul>
<div class="chips"><span class="chip">4:3</span><span class="chip">16:9</span><span class="chip">21:9</span><span class="chip">9:16 (vertical)</span><span class="chip">1:1</span></div>
<h2>Cómo se calcula</h2>
<ol>
<li>Medimos el ancho y el alto.</li>
<li>Buscamos su <strong>máximo común divisor</strong> (MCD).</li>
<li>Dividimos ancho y alto entre el MCD.</li>
<li>Los dos resultados son la relación.</li>
</ol>
<code class="formula">1920 × 1080 → MCD = 120 → 1920/120 : 1080/120 = 16 : 9</code>`,
  after: exercise('1.3', `<p>Para las siguientes resoluciones calcula su máximo común divisor y sus relaciones de aspecto correspondientes:</p><ul><li>640×480 px</li><li>1024×576 px</li><li>1440×2560 px</li><li>2560×1080 px</li><li>750×1334 px</li></ul><p>¿Podrías identificar alguna de las anteriores resoluciones y averiguar su nombre?</p>`),
  widgets: [W('aspecto', 'Calcula la relación de aspecto', 'Escribe un ancho y un alto. El simulador busca el MCD y dibuja la forma resultante.')],
  quiz: [
    { q: '¿Qué significa 16:9?', o: ['16 píxeles de alto por 9 de ancho', '16 unidades de ancho por 9 de alto', '16 pulgadas de diagonal', '16 fotogramas cada 9 segundos'], a: 1, why: 'La relación es anchura : altura.' },
    { q: '¿Cuál es la relación de aspecto de 640 × 480?', o: ['16:9', '5:4', '4:3', '3:2'], a: 2, why: 'MCD = 160 → 640/160 : 480/160 = 4:3.' },
    { q: '¿Qué operación se usa para simplificar la relación?', o: ['Mínimo común múltiplo', 'Máximo común divisor', 'Raíz cuadrada', 'Regla de tres'], a: 1, why: 'Se dividen ancho y alto entre su MCD.' }
  ]
},
{
  n: 3, unit: 1, title: 'Proporción de píxel: DAR, PAR y SAR',
  lede: 'Los píxeles no siempre son cuadrados, y eso cambia la forma de la imagen.',
  body: `
<h2>El píxel</h2>
<p>Un píxel es la menor unidad homogénea en color de una imagen digital. Puede ser <strong>cuadrado o rectangular</strong>.</p>
<h2>Tres relaciones</h2>
${tbl(['Sigla', 'Nombre', 'Qué relaciona'], [
  ['DAR', 'Display Aspect Ratio', 'Ancho y alto de la imagen en pantalla'],
  ['PAR', 'Pixel Aspect Ratio', 'Ancho y alto de cada píxel'],
  ['SAR', 'Storage Aspect Ratio', 'Ancho y alto en píxeles almacenados']
])}
<code class="formula">DAR = PAR × SAR</code>
<ul>
<li>Si DAR = SAR, los píxeles son cuadrados (PAR 1:1).</li>
<li>Si no coinciden, el píxel es rectangular y el PAR lo compensa.</li>
</ul>
<div class="callout"><p>Ejemplo: 720 × 576 almacena 5:4, pero se ve en 4:3. PAR = (4/3) ÷ (5/4) = 16:15 → píxel un poco más ancho que alto.</p></div>`,
  after: exercise('1.4', `<p>Una imagen tiene un SAR de 640x480 px y se muestra en una pantalla con DAR 4:3. ¿Son los píxeles cuadrados?</p><p>Otra imagen con resolución 720x576 px tiene un SAR de 5:4. ¿Qué ocurre si la mostramos en una pantalla con DAR 4:3?</p>`) +
    exercise('1.7', `<p>Un archivo de vídeo tiene una resolución de almacenamiento (SAR) de 1440×1080 px y debe visualizarse con una relación de aspecto de pantalla (DAR) de 16:9. Calcula el PAR necesario para que la imagen se vea sin deformación.</p>`),
  widgets: [W('par', 'Del almacenamiento a la pantalla', 'Elige cómo se guarda la imagen y cómo se muestra. El simulador calcula el PAR y dibuja la forma del píxel.')],
  quiz: [
    { q: '¿Qué relaciona el PAR?', o: ['El ancho y el alto de la pantalla', 'El ancho y el alto de cada píxel', 'Los píxeles almacenados', 'Los fotogramas por segundo'], a: 1, why: 'PAR = Pixel Aspect Ratio.' },

  n: 8, unit: 1, title: 'Loops y códecs para VJ',
  lede: 'Un loop tiene que durar un número exacto de pulsos, y reproducirse en un códec pensado para directo.',
  body: `
<h2>Cálculo de loops</h2>
<ul>
<li>Para que un loop encaje con la música, su duración debe ser un número exacto de pulsos (beats). En 4/4 hay 4 pulsos por compás.</li>
</ul>
<code class="formula">Pulso = 60 / BPM (s) · Loop = (60 / BPM) × nº de pulsos · Fotogramas = duración × fps</code>
<p><strong>Ejemplo:</strong> 128 BPM, 4 compases (16 pulsos) a 30 fps → 60/128 = 0,46875 s · × 16 = 7,5 s · × 30 = <strong>225 fotogramas</strong>.</p>
<p>Si no sale un número entero de fotogramas se redondea: con BPM Sync, Resolume ajusta la velocidad del clip para cuadrarlo con el tempo.</p>
<h2>Por qué intra-frame en directo</h2>
<ul>
<li>En directo se reproducen varias capas, se salta entre puntos cue, se cambia la velocidad y se va hacia atrás: <strong>cada fotograma debe poder decodificarse por sí solo</strong>.</li>
<li>H.264 y H.265 son <strong>inter-frame</strong>: ocupan poco, pero cargan la CPU y responden mal a saltos y scratch. Sirven para entregar, no para actuar.</li>
<li>Los códecs de VJ se decodifican en la <strong>GPU</strong> y pesan bastante más.</li>
</ul>
<div class="callout"><p>Regla práctica: el máster se exporta en un códec de calidad (ProRes) y de ahí se convierte al códec de reproducción (DXV o HAP).</p></div>
<h2>Los habituales</h2>
${tbl(['Códec', 'Decodifica', 'Alfa', 'Uso'], [
  ['DXV 3 (Resolume)', 'GPU', 'Opcional', 'Nativo de Resolume. Alley convierte gratis'],
  ['HAP / HAP Alpha / HAP Q', 'GPU', 'HAP Alpha', 'Abierto: Resolume, TouchDesigner, MadMapper, Millumin'],
  ['ProRes 422 / 4444', 'CPU', '4444', 'Máster y edición; más exigente en directo'],
  ['NotchLC', 'GPU', 'Sí', 'Alta calidad y profundidad de color; degradados']
])}
<p>Contenedor habitual en todos ellos: <strong>.mov</strong></p>`,
  widgets: [
    W('loops', 'Calculadora de loops', 'Ajusta el tempo, los compases y los fps. El punto late al tempo elegido.'),

<h2>Qué son los PPP</h2>
<ul>

<p>Estándares de la televisión analógica, que se repartían buena parte del mundo. De ellos vienen las cadencias de hoy: <strong>25/50</strong> (PAL, Europa) y <strong>30/60</strong> (NTSC, América y Japón). La TDT tiene sus propios estándares.</p>

<h2>NDI · Network Device Interface</h2>
<ul>
<li>Protocolo de NewTek para transmitir vídeo, audio y metadatos en tiempo real por redes IP locales.</li>
<li>Envía y recibe señales sin cables dedicados ni hardware especializado: con cable de red (Ethernet) o por red inalámbrica.</li>
<li>Es bidireccional y necesita un ancho de banda elevado.</li>

<h2>Extensores de vídeo</h2>
<ul>
<li>Llevan la señal más lejos de lo que permite el cable estándar, sin pérdida significativa.</li>
<li>Se colocan <strong>en pareja</strong>: el <strong>transmisor (Tx)</strong> convierte la señal para viajar por otro medio (cable de red, fibra) y el <strong>receptor (Rx)</strong> la devuelve a HDMI/DVI/DP.</li>
<li>Alcances típicos: 50–100 m; kilómetros con fibra. Muy usados con HDBaseT.</li>
</ul>
<div class="callout"><p><strong>Importante: el sentido de la señal.</strong> Tx junto a la fuente, Rx junto a la pantalla. Si se invierten, no hay imagen.</p></div>`,

{
  n: 17, unit: 3, title: 'Brillo, contraste y HDR',
  lede: 'Los mismos lúmenes dan una imagen brillante o apagada según el tamaño y la luz de la sala.',
  body: `
<h2>Brillo</h2>
<ul>
<li>Cantidad de luz que emite el proyector (flujo luminoso). Se mide en <strong>lúmenes (lm)</strong>.</li>
<li>La imagen se ve más o menos brillante según los lúmenes, el tamaño de la imagen y la luz ambiente.</li>
</ul>
<code class="formula">Iluminancia (lux) = lúmenes ÷ superficie (m²)</code>
<p>5.000 lm sobre 3 m de ancho (16:9, ≈ 5 m²) ≈ 1.000 lux. Los mismos 5.000 lm sobre 6 m de ancho (≈ 20 m²) ≈ 250 lux: <strong>cuatro veces menos</strong>.</p>
<h2>Lúmenes: ANSI, ISO y «LED»</h2>
${tbl(['Medida', 'Cómo se obtiene', 'Fiabilidad'], [
  ['ANSI (IT7.228)', 'Blanco sobre la pantalla dividida en 9 zonas; se promedia', 'Valor de referencia para comparar'],
  ['ISO (21118)', 'Mismo método de 9 puntos; los equipos de serie no pueden bajar más de un 20 % de lo declarado', 'Suele dar valores algo menores que ANSI'],
  ['«Lúmenes LED» / de fuente', 'Luz antes de la óptica, o con multiplicadores de marketing', 'No es un estándar: pueden ser varias veces mayores que los reales']
])}
<p>No hay factor de conversión entre ISO y ANSI: el 20 % es la tolerancia que admite ISO. Si el fabricante no indica el método, desconfía.</p>
<h2>Contraste, gamma y HDR</h2>
<ul>
<li><strong>Contraste:</strong> diferencia entre el blanco más brillante y el negro más oscuro. 10.000:1 = el blanco es 10.000 veces más luminoso que el negro.</li>
<li><strong>Gamma:</strong> cómo se representan los tonos intermedios. No cambia el máximo ni el mínimo, sino la curva.</li>
<li><strong>HDR</strong> (alto rango dinámico): más diferencia entre luces y sombras. El contenido debe estar grabado en HDR y todo el equipo (reproductor, cable y proyector) debe ser compatible.</li>
</ul>`,

    { q: '¿Qué medida de lúmenes NO es un estándar?', o: ['ANSI', 'ISO', '«Lúmenes LED»', 'Ninguna'], a: 2, why: 'Los «lúmenes LED» o de fuente no siguen ninguna norma.' },

{
  n: 19, unit: 3, title: 'Keystone, lens shift y corrección de esquinas',
  lede: 'Tres formas de encajar la imagen cuando el proyector no está frente a la pantalla.',
  body: `
<h2>El problema</h2>
<p>Si el proyector no está perpendicular a la pantalla, la imagen sale deformada en forma de <strong>trapecio</strong>.</p>
<h2>Las tres herramientas</h2>
${tbl(['Ajuste', 'Qué hace', 'Tipo', 'Calidad'], [
  ['Keystone', 'Corrige el trapecio de forma global (vertical u horizontal; a veces automático)', 'Digital', 'Pierde resolución y nitidez'],
  ['Lens shift', 'Mueve físicamente la lente y desplaza la imagen sin deformarla', 'Óptico', 'No pierde calidad'],
  ['Corner correction', 'Ajusta cada esquina por separado', 'Digital', 'Puede restar nitidez']
])}
<ul>
<li>El lens shift se expresa en porcentaje del tamaño de la imagen: ±50 % vertical = la imagen sube o baja hasta la mitad de su altura. Solo en gama media y alta.</li>
<li>Orden recomendado: <strong>colocar bien el proyector → lens shift → correcciones digitales</strong>.</li>
</ul>
<h2>Focus, zoom y crop</h2>
<ul>
<li><strong>Focus</strong> = nitidez. Manual (anillo) o automático.</li>
<li><strong>Zoom</strong> = tamaño. El óptico mueve la lente y mantiene la calidad; el digital recorta la señal y pierde resolución.</li>
<li><strong>Crop</strong> = recorte: elimina parte de la imagen sin deformarla ni cambiar su tamaño. Sirve para ajustar proporciones, enmascarar zonas o mostrar solo un fragmento en mapping.</li>
</ul>`,
  widgets: [W('keystone', 'Trapecio y corrección', 'Sube o baja el proyector. Compara inclinarlo y corregir con keystone frente a usar el lens shift.')],

    { q: '¿Qué corrige el keystone?', o: ['El desenfoque', 'La deformación trapezoidal', 'El color', 'El brillo'], a: 1, why: 'Devuelve la forma rectangular a una imagen en trapecio.' },
    { q: '¿En qué se diferencia el crop del zoom?', o: ['El crop cambia el tamaño', 'El crop elimina partes de la imagen sin cambiar su tamaño', 'Son lo mismo', 'El crop enfoca'], a: 1, why: 'Recortar no escala: quita lo que queda fuera.' }

{

  lede: 'LCD, DLP y láser por dentro, y el cable de red que lleva vídeo a 100 metros.',
  body: `
<h2>Cómo forman la imagen</h2>
${tbl(['Tecnología', 'Ventajas', 'Inconvenientes', 'Uso típico'], [
  ['LCD', 'Colores vivos, buen precio, buena definición en texto', 'Menor contraste, mantenimiento de filtros y lámpara', 'Aulas, oficinas, presentaciones'],
  ['DLP', 'Alto contraste, fluidez en vídeo, portátiles', 'Efecto arco iris (DLP de 1 chip), colores menos vivos', 'Cine en casa, vídeo en movimiento, eventos medianos'],
  ['Láser (fuente de luz)', 'Muy brillante, larga vida útil, poco mantenimiento', 'Precio alto', 'Grandes eventos, mapping, instalaciones profesionales']
])}
<ul>
<li><strong>LCD:</strong> la luz atraviesa tres paneles de cristal líquido (rojo, verde y azul) y se combinan las tres imágenes.</li>
<li><strong>DLP:</strong> un chip con microespejos refleja la luz miles de veces por segundo. Con un chip, una rueda de color forma la imagen; con tres chips (cine, eventos) no hay rueda.</li>
<li><strong>Láser:</strong> es la <em>fuente de luz</em>, no la forma de crear la imagen: sustituye a la lámpara en equipos LCD o DLP.</li>
</ul>
<h2>HDBaseT</h2>
<p>Protocolo que envía vídeo, audio y datos a larga distancia por <strong>un solo cable de red</strong> (Cat5e, Cat6 o superior), con transmisor (Tx) y receptor (Rx) compatibles.</p>

<ul><li>4K hasta 30 Hz (o 60 Hz en 4:2:0) en HDBaseT clásico.</li><li>Hasta <strong>100 m</strong> con cable Cat6 de calidad, frente a los 10–15 m del HDMI convencional.</li></ul>`,

  body: `
<h2>Video mapping</h2>
<p>Técnica de usar proyectores para convertir objetos reales (edificios, decorados, escenarios) en superficies dinámicas. No se proyecta sobre una pantalla plana, sino sobre volúmenes.</p>
<ol>
<li><strong>Análisis y medición</strong> del espacio: fotos, planos o escáner 3D.</li>
<li><strong>Réplica</strong> del objeto en un software de 3D o de mapping.</li>
<li><strong>Diseño de contenidos</strong> que encajen con el objeto.</li>
<li><strong>Calibración:</strong> colocar los proyectores y ajustar con keystone, corner correction y warping.</li>
</ol>
<h2>Grid (test pattern)</h2>
<p>Rejilla de líneas que se proyecta al empezar como guía de calibración: muestra si la imagen está alineada, centrada y sin deformaciones. Cuando la rejilla encaja con la superficie real, se lanza el contenido.</p>
<h2>Warping</h2>
<p>Deforma digitalmente la imagen con una <strong>malla de puntos de control</strong> que se mueven, estiran o curvan hasta encajar en superficies irregulares. Es el ajuste más avanzado y la herramienta clave del mapping profesional.</p>
<h2>Blending</h2>
<p>Superpone parcialmente la imagen de dos o más proyectores para crear una sola imagen continua. En la zona de unión cada proyector baja su brillo con una rampa (degradado) para que la suma se vea como el resto.</p>
<code class="formula">Resolución horizontal total = N × ancho − (N − 1) × solape</code>
<p><strong>Ejemplo:</strong> 2 proyectores de 1920 px con un solape del 10 % (192 px) → 2 × 1920 − 192 = 3.648 px.</p>

  body: `
<h2>Qué es</h2>
<p>Técnica que trata un conjunto de píxeles o luminarias como los píxeles de una pantalla de baja resolución para asignarles contenido visual.</p>
<ul>
<li><strong>Pantallas LED:</strong> el pixel map es el plano que indica qué parte de la imagen va a cada pantalla o cabina.</li>
<li><strong>Iluminación:</strong> cada foco o tira LED es un píxel; el color del vídeo se envía como datos DMX / Art-Net.</li>

<p>Diferencia con el video mapping: aquel proyecta sobre superficies; el pixel mapping controla píxeles o luminarias individuales.</p>
<h2>En pantallas LED: flujo de trabajo</h2>
<p>Ejemplo (todo P5): central de 6 × 3 m = 1200 × 600 px y dos laterales de 1,8 × 3 m = 360 × 600 px. Lienzo de salida: 360 + 1200 + 360 = <strong>1920 × 600 px</strong> (cabe en una salida Full HD).</p>
<ol>
<li>Definir cada pantalla en píxeles (tamaño ÷ pitch).</li>
<li>Dibujar el pixel map: un rectángulo por pantalla, en su posición dentro del lienzo.</li>
<li>Configurar la salida en el software (en Resolume: Advanced Output, un slice por pantalla).</li>
<li>Ajustar la controladora: qué parte del lienzo recibe cada pantalla o puerto.</li>
<li>Probar con un patrón numerado: orientación, cabinas y continuidad.</li>
</ol>
<div class="callout"><p>Regla de oro: <strong>1 píxel de contenido = 1 píxel LED</strong>. Sin escalar, la imagen se ve nítida.</p></div>
<h2>En iluminación: DMX y Art-Net</h2>
<ul>
<li>Un universo DMX tiene 512 canales (valores de 0 a 255).</li>

function setupCanvas(cv, w, h) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

function wl2rgb(w) {
  let r = 0, g = 0, b = 0;
  if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
  else if (w < 490) { g = (w - 440) / 50; b = 1; }
  else if (w < 510) { g = 1; b = -(w - 510) / 20; }
  else if (w < 580) { r = (w - 510) / 70; g = 1; }
  else if (w < 645) { r = 1; g = -(w - 645) / 65; }
  else if (w <= 780) { r = 1; }
  let f = 0;
  if (w >= 380 && w <= 780) f = w < 420 ? .3 + .7 * (w - 380) / 40 : w > 700 ? .3 + .7 * (780 - w) / 80 : 1;
  const c = v => Math.round(255 * Math.pow(v * f, .8));
  return [c(r), c(g), c(b)];
}

function kelvinRGB(K) {
  const t = K / 100, c = v => Math.round(clamp(v, 0, 255));
  const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  const b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  return [c(r), c(g), c(b)];
}

/* Proyección: devuelve f(u,v) → punto en la pared z = wallZ. u,v en [-0.5, 0.5].
   P = posición de la lente, tilt = inclinación (rad, + hacia arriba), tr = throw ratio,
   asp = relación de aspecto, shV = lens shift vertical (fracción del alto de imagen). */
function projMap(P, tilt, tr, asp, shV, wallZ) {
  const c = Math.cos(tilt), s = Math.sin(tilt);
  return (u, v) => {
    const x = u / tr, y = (v + shV) / (tr * asp);
    const dy = y * c + s, dz = y * s - c, k = (wallZ - P[2]) / dz;
    return [P[0] + k * x, P[1] + k * dy, wallZ];
  };
}

/* ============================================================

/* ── Panel de controles ── */
function buildControls(host, specs, ui) {
  host.innerHTML = '';
  const els = {}; let reads = null;
  specs.forEach(s => {
    if (s.t !== 'read') reads = null;
    if (s.t === 'range') {
      const w = document.createElement('div'); host.appendChild(w);
      w.innerHTML = `<label class="ctl"><span class="ctl-l">${s.label}</span><output class="ctl-o"></output><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.v}"></label>`;
      const inp = w.querySelector('input'), out = w.querySelector('output');
      const upd = () => { out.textContent = s.fmt ? s.fmt(+inp.value) : inp.value; };
      inp.addEventListener('input', () => { upd(); s.on && s.on(+inp.value); });
      upd(); els[s.id] = { inp, upd, w };
    } else if (s.t === 'chips') {
      const w = document.createElement('div'); host.appendChild(w);
      w.innerHTML = `${s.label ? `<span class="ctl-l" style="font-size:.88rem">${s.label}</span>` : ''}<div class="btns">${s.opts.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="${o[0] === s.v}">${o[1]}</button>`).join('')}</div>`;
      const btns = [...w.querySelectorAll('.opt')];
      btns.forEach((b, i) => b.addEventListener('click', () => { btns.forEach(x => x.setAttribute('aria-pressed', x === b)); s.on && s.on(s.opts[i][0]); }));
      els[s.id] = { btns, opts: s.opts, w };
    } else if (s.t === 'toggle') {
      const w = document.createElement('div'); host.appendChild(w);
      w.innerHTML = `<button class="opt" aria-pressed="${!!s.v}">${s.label}</button>`;
      const b = w.querySelector('button');
      b.addEventListener('click', () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); s.on && s.on(v); });
      els[s.id] = { b, w };
    } else if (s.t === 'btn') {
      const w = document.createElement('div'); host.appendChild(w);
      w.innerHTML = `<button class="btn small${s.primary ? ' primary' : ''}">${s.label}</button>`;
      w.querySelector('button').addEventListener('click', () => s.on && s.on());
    } else if (s.t === 'read') {
      if (!reads) { reads = document.createElement('div'); reads.className = 'reads'; host.appendChild(reads); }
      const r = document.createElement('div'); r.className = 'read' + (s.hot ? ' hot' : '') + (s.txt ? ' txt' : ''); r.innerHTML = `<b>—</b><span>${s.label}</span>`; reads.appendChild(r);
      els[s.id] = { b: r.querySelector('b') };
    } else if (s.t === 'html') {
      const w = document.createElement('div'); host.appendChild(w); w.innerHTML = s.html || ''; els[s.id] = { w };
    } else if (s.t === 'note') {
      const w = document.createElement('p'); w.className = 'note'; w.textContent = s.text; host.appendChild(w);
    }
  });
  host.style.display = 'grid'; host.style.gap = '12px';
  ui.read = (id, txt) => { if (els[id] && els[id].b && els[id].b.tagName === 'B') els[id].b.textContent = txt; };
  ui.html = (id, h) => { if (els[id]) els[id].w.innerHTML = h; };
  ui.el = id => els[id] && els[id].w;
  ui.set = (id, v) => {
    const e = els[id]; if (!e) return;
    if (e.inp) { e.inp.value = v; e.upd(); }
    else if (e.btns) e.btns.forEach((b, i) => b.setAttribute('aria-pressed', e.opts[i][0] === v));
    else if (e.b && e.b.tagName === 'BUTTON') e.b.setAttribute('aria-pressed', !!v);
  };
  ui.show = (id, on) => { if (els[id] && els[id].w) els[id].w.style.display = on ? '' : 'none'; };
}

const KS = { W: 6.4, H: 3.6, cy: 3.2, D: 7, wallZ: -6 };
function keystoneCalc(h, mode, k) {
  const tr = KS.D / KS.W, P = [0, h, KS.wallZ + KS.D], asp = 16 / 9;

  if (mode === 'shift') sh = clamp(need, -.6, .6); else tilt = Math.atan2(KS.cy - h, KS.D);
  const f = projMap(P, tilt, tr, asp, sh, KS.wallZ);
  const panel = [f(-.5, .5), f(.5, .5), f(.5, -.5), f(-.5, -.5)];           // TL TR BR BL
  const wt = panel[1][0] - panel[0][0], wb = panel[2][0] - panel[3][0], wn = Math.min(wt, wb), hn = wn * 9 / 16;
  const rect = [[-wn / 2, KS.cy + hn / 2, KS.wallZ], [wn / 2, KS.cy + hn / 2, KS.wallZ], [wn / 2, KS.cy - hn / 2, KS.wallZ], [-wn / 2, KS.cy - hn / 2, KS.wallZ]];
  const kk = mode === 'shift' ? 0 : k, img = panel.map((p, i) => p.map((v, j) => v + (rect[i][j] - v) * kk));

}

function homography(dst) {            // de cuadrado unidad a 4 puntos (TL, TR, BR, BL)
  const src = [[0, 0], [1, 0], [1, 1], [0, 1]], A = [];
  for (let i = 0; i < 4; i++) { const [x, y] = src[i], [X, Y] = dst[i]; A.push([x, y, 1, 0, 0, 0, -x * X, -y * X, X]); A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y, Y]); }
  for (let c = 0; c < 8; c++) {
    let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]]; const d = A[c][c] || 1e-9;
    for (let j = c; j < 9; j++) A[c][j] /= d;
    for (let r = 0; r < 8; r++) if (r !== c) { const f = A[r][c]; for (let j = c; j < 9; j++) A[r][j] -= f * A[c][j]; }
  }
  const h = A.map(r => r[8]);
  return (x, y) => { const w = h[6] * x + h[7] * y + 1; return [(h[0] * x + h[1] * y + h[2]) / w, (h[3] * x + h[4] * y + h[5]) / w]; };
}

  let done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { /* sin almacenamiento */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignorar */ } };

  const $ = s => document.querySelector(s);
  const total = LESSONS.length;
  const byN = n => LESSONS.find(l => l.n === n);
  const GL = typeof HAS_GL !== 'undefined' && HAS_GL && typeof THREE !== 'undefined';
  let current = null;                      // { stage }
  const disposeStage = () => { if (current) { try { current.stage.dispose(); } catch (e) { /* ya liberado */ } current = null; } };

  /* ── Marco común ── */
  function shell(current, route) {
    $('#side').innerHTML = '<a class="side-home" href="https://javitatay.github.io/AVV/"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true"><path d="M12 4 6 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Volver a AVV Lab</a>' + Object.keys(UNITS).map(Number).map(u => `<h3>${UNITS[u].title}</h3>` + LESSONS.filter(l => l.unit === u).map(l =>
      `<a href="#leccion-${l.n}" ${current === l.n ? 'aria-current="page"' : ''}><span class="num">${l.n}</span><span>${l.title}</span>${done.has(l.n) ? '<span class="tick" aria-label="completada">✓</span>' : ''}</a>`).join('')).join('');
    $('#count').textContent = `${done.size}/${total}`;
    document.querySelectorAll('.topnav a').forEach(a => { if (a.getAttribute('href') === '#' + route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    document.body.classList.remove('menu-open');
  }

  /* ── Visor 3D ── */
  function mountScene(host, key, opts = {}) {
    host.innerHTML = '<canvas aria-label="Escena 3D interactiva: arrastra para girar, rueda para acercar"></canvas><div class="hud" aria-live="polite"></div>' +
      (opts.bare ? '' : '<div class="vbtns"><button type="button" class="vreset" title="Restablecer la vista" aria-label="Restablecer la vista">⟲</button></div><div class="hint">Arrastra para girar · rueda o pellizco para acercar</div>');
    const canvas = host.querySelector('canvas'), hud = host.querySelector('.hud');
    const stage = new Stage(canvas, { haze: .45 });
    current = { stage };
    const ui = { hud: h => { hud.innerHTML = h; } };
    const sc = SCENES[key](stage, ui);
    const home = { g: { ...stage.goal }, t: stage.tgtGoal.clone() };
    const rb = host.querySelector('.vreset');
    if (rb) rb.addEventListener('click', () => { Object.assign(stage.goal, home.g); stage.tgtGoal.copy(home.t); });
    const hint = host.querySelector('.hint');
    if (hint) { const hide = () => { hint.style.opacity = 0; }; canvas.addEventListener('pointerdown', hide, { once: true }); setTimeout(hide, 9000); }
    return { stage, ui, sc };
  }

  /* ── Inicio ── */
  function cardHTML(l, k) {
    const m = META[l.n], tag = m.scene ? 'Escena 3D' : (l.widgets && l.widgets.length ? 'Simulador' : 'Apuntes');
    return `<a class="card t${(l.n - 1) % 4 + 1}" href="#leccion-${l.n}" style="animation-delay:${40 + k * 45}ms">${done.has(l.n) ? '<span class="ok" aria-label="completada">✓</span>' : ''}
      <div class="card-top"><span class="card-icon" aria-hidden="true">${m.icon}</span><span class="card-ud">UD${l.unit} · L${l.n}</span></div>
      <div class="card-body"><h3 class="card-title">${l.title}</h3></div>
      <div class="card-foot"><span class="card-tag${m.scene ? ' on' : ''}">${tag}</span><span class="card-btn">Abrir →</span></div></a>`;
  }

  function home() {
    document.title = 'Imagen y vídeo · AVV Lab';
    shell(null, 'inicio');
    const next = nextPending(), n3d = Object.values(META).filter(m => m.scene).length;
    $('#view').innerHTML = `
      <section class="hero"><div class="hero-copy">
          <h1>Imagen y vídeo <em>para directo</em></h1>
          <p class="hero-sub">Cambia la focal, mueve el proyector, monta una pantalla LED y mira qué pasa. Del píxel al pixel mapping, con escenas 3D y simuladores que respondes tú.</p>
          <ul class="hero-stats"><li class="hero-stat"><span class="hero-stat-n">${total}</span><span class="hero-stat-l">Lecciones</span></li><li class="hero-stat"><span class="hero-stat-n">${n3d}</span><span class="hero-stat-l">Escenas 3D</span></li><li class="hero-stat"><span class="hero-stat-n">${Object.keys(WIDGETS).length}</span><span class="hero-stat-l">Simuladores</span></li><li class="hero-stat"><span class="hero-stat-n">${Object.keys(UNITS).length}</span><span class="hero-stat-l">Unidades</span></li></ul>
          <div class="hero-cta"><a class="btn primary" href="#leccion-${next}">${done.size ? 'Continuar · lección ' + next : 'Empezar'}</a><a class="btn" href="#leccion-17">Ir a proyección y LED</a></div></div>
        <div class="frame hero-art"><div class="viewer" id="hero" role="img" aria-label="Escena 3D de una cabina de VJ con una pantalla LED al fondo"></div></div></section>
      ${Object.keys(UNITS).map(Number).map(u => `<div class="section-header"><h2 class="section-title">${UNITS[u].title}</h2><span class="section-sub">${UNITS[u].sub}</span><span class="section-line"></span></div><div class="grid">${LESSONS.filter(l => l.unit === u).map((l, k) => cardHTML(l, k)).join('')}</div>`).join('')}
      <footer class="footer"><p><strong>AVV Lab</strong> · Animación Visual en Vivo · CFGM Video DJ</p><p>Material didáctico de imagen y vídeo, unidades 1, 2 y 3 · uso educativo · <a href="https://javitatay.github.io/AVV/">Volver a AVV Lab</a></p></footer>`;
    window.scrollTo(0, 0);
    const host = $('#hero');
    const fb = () => { host.innerHTML = '<div class="hero-fallback">' + LOGO_SVG + '</div>'; };
    if (GL) { try { mountScene(host, 'portada', { bare: true }); } catch (e) { console.error(e); disposeStage(); fb(); } } else fb();
  }

  function nextPending() { const n = LESSONS.find(l => !done.has(l.n)); return n ? n.n : 1; }

  /* ── Cuestionario ── */
  function quizHTML(l) {
    if (!l.quiz || !l.quiz.length) return '<p class="note">Esta lección no tiene preguntas. Márcala como completada cuando la hayas revisado.</p>';
    return `<section class="quiz">
      ${l.quiz.map((q, i) => `<div class="q" data-i="${i}"><p>${q.q}</p><div class="answers">${q.o.map((o, j) => `<button class="a" data-j="${j}">${o}</button>`).join('')}</div><p class="why" hidden></p></div>`).join('')}
      <p class="score" id="score" aria-live="polite"></p></section>`;
  }

  function wireQuiz(l) {
    const box = $('.quiz'); if (!box) return;
    let answered = 0, right = 0;
    box.querySelectorAll('.q').forEach(qe => {
      const q = l.quiz[+qe.dataset.i];
      qe.querySelectorAll('.a').forEach(b => b.addEventListener('click', () => {
        const j = +b.dataset.j;
        qe.querySelectorAll('.a').forEach(x => { x.disabled = true; if (+x.dataset.j === q.a) x.classList.add('ok'); });
        if (j !== q.a) b.classList.add('no'); else right++;
        const w = qe.querySelector('.why'); w.hidden = false; w.textContent = (j === q.a ? 'Correcto. ' : 'No es esa. ') + q.why;
        answered++;
        $('#score').textContent = `${right} de ${l.quiz.length} correctas`;
        if (answered === l.quiz.length) { done.add(l.n); save(); markBtn(l); shell(l.n, 'leccion-' + l.n); }
      }));
    });
  }

  function markBtn(l) {
    const b = $('#mark'); if (!b) return;
    const d = done.has(l.n);
    b.textContent = d ? '✓ Completada' : 'Marcar como hecha';
    b.setAttribute('aria-pressed', d);
  }

  function widgetCard(l, key, i) {
    const w = l.widgets.find(x => x.key === key); if (!w) return '';
    return `<section class="widget" aria-label="${w.title}"><header><div class="wtag">Simulador</div><h3>${w.title}</h3><p class="wnote">${w.note}</p></header><div class="wbody" data-w="${key}"></div></section>`;
  }
  function runWidgets(root) {
    root.querySelectorAll('[data-w]').forEach(host => {
      try { WIDGETS[host.dataset.w](host); } catch (e) { host.innerHTML = '<p class="note">No se ha podido cargar este simulador.</p>'; console.error(host.dataset.w, e); }
    });
  }

  /* ── Lección ── */
  function lesson(n) {
    const l = byN(n); if (!l) return home();
    const M = META[n];
    document.title = `${l.n}. ${l.title} · Imagen y vídeo · AVV Lab`;
    shell(n, 'leccion-' + n);
    const prev = byN(n - 1), next = byN(n + 1);
    const use3D = GL && !!M.scene;
    const allKeys = (l.widgets || []).map(w => w.key);
    // qué simuladores 2D se muestran y dónde
    const keys2D = M.scene ? (use3D ? (M.extras || []) : [...(M.fallback || []), ...(M.extras || [])]) : allKeys;
    const bodyInMain = !use3D && !keys2D.length;
    const tabs = [...(use3D ? [['explorar', 'Explorar']] : []), ['ideas', 'Ideas'], ['prueba', 'Prueba'], ...(bodyInMain ? [] : [['apuntes', 'Apuntes']])];
    const first = tabs[0][0];
    $('#view').innerHTML = `<div class="lpage">
      <div class="lhead"><span class="kicker">UD${l.unit} · Lección ${l.n}/${total}</span><h1>${l.title}</h1></div>
      <div class="lgrid">
        <div class="lmain">
          ${use3D ? '<div class="viewer" id="viewer"></div>' : ''}
          ${!use3D && M.scene ? '<p class="note">Tu navegador no puede mostrar la escena 3D (WebGL). Usa los simuladores de abajo.</p>' : ''}
          ${keys2D.length ? `<div class="extras">${keys2D.map((k, i) => widgetCard(l, k, i)).join('')}</div>` : ''}
          ${bodyInMain ? `<div class="prose">${l.body}${l.after || ''}</div>` : ''}
        </div>
        <aside class="dock" aria-label="Panel de la lección">
          <div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" id="t-${t[0]}" aria-controls="p-${t[0]}" aria-selected="${t[0] === first}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
          ${use3D ? '<div class="pane" id="p-explorar" role="tabpanel" aria-labelledby="t-explorar"><div id="ctl"></div></div>' : ''}
          <div class="pane" id="p-ideas" role="tabpanel" aria-labelledby="t-ideas" ${first === 'ideas' ? '' : 'hidden'}><p class="lede2">${l.lede}</p><ul class="keys">${M.bullets.map(b => `<li>${b}</li>`).join('')}</ul></div>
          <div class="pane" id="p-prueba" role="tabpanel" aria-labelledby="t-prueba" hidden>${quizHTML(l)}</div>
          ${bodyInMain ? '' : `<div class="pane" id="p-apuntes" role="tabpanel" aria-labelledby="t-apuntes" hidden><div class="prose">${l.body}${l.after || ''}</div></div>`}
          <div class="dockfoot">${prev ? `<a class="btn small" href="#leccion-${prev.n}" aria-label="Lección anterior">←</a>` : '<span></span>'}<button class="btn small" id="mark" aria-pressed="false"></button>${next ? `<a class="btn small primary" href="#leccion-${next.n}">Siguiente →</a>` : '<a class="btn small primary" href="#inicio">Inicio</a>'}</div>
        </aside></div></div>`;
    window.scrollTo(0, 0);

    // pestañas
    const tabEls = [...document.querySelectorAll('.tabs [role=tab]')];
    const showTab = id => {
      tabEls.forEach(t => t.setAttribute('aria-selected', t.dataset.t === id));
      tabs.forEach(t => { const p = $('#p-' + t[0]); if (p) p.hidden = t[0] !== id; });
    };
    tabEls.forEach(t => t.addEventListener('click', () => showTab(t.dataset.t)));
    tabEls.forEach((t, i) => t.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const o = tabEls[(i + (e.key === 'ArrowRight' ? 1 : tabEls.length - 1)) % tabEls.length]; o.focus(); showTab(o.dataset.t); }
    }));

    // escena 3D
    if (use3D) {
      const host = $('#viewer');
      try {
        const m = mountScene(host, M.scene);
        buildControls($('#ctl'), m.sc.controls, m.ui);
        m.sc.refresh && m.sc.refresh();
      } catch (e) {
        console.error(e); disposeStage();
        host.outerHTML = '<p class="note">No se ha podido iniciar la escena 3D; se muestran los simuladores 2D.</p>';
        // recurrir a los simuladores 2D de respaldo
        const ex = document.createElement('div'); ex.className = 'extras';
        ex.innerHTML = [...(M.fallback || []), ...(M.extras || [])].map(k => widgetCard(l, k)).join('');
        $('.lmain').appendChild(ex); runWidgets(ex);
        const t = $('#t-explorar'); if (t) { t.remove(); $('#p-explorar').remove(); showTab('ideas'); }
      }
    }
    runWidgets($('.lmain'));
    wireQuiz(l);
    markBtn(l);
    $('#mark').addEventListener('click', () => { done.has(l.n) ? done.delete(l.n) : done.add(l.n); save(); markBtn(l); shell(l.n, 'leccion-' + l.n); });
  }

  function route() {
    disposeStage();
    const h = location.hash.slice(1);
    const m = /^leccion-(\d+)$/.exec(h);
    try {
      if (m) lesson(+m[1]); else home();
    } catch (e) { console.error(e); $('#view').innerHTML = '<p class="note" style="padding:24px">Algo ha fallado al cargar esta página. <a href="#inicio">Volver al inicio</a></p>'; }
  }

  $('#menu').addEventListener('click', () => document.body.classList.toggle('menu-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('menu-open'));
  window.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('menu-open'); });
  window.addEventListener('hashchange', route);
  route();
})();

</script>
<script>
(function () {
  var root = document.documentElement, btn = document.getElementById('themeToggle');
  if (!btn) return;
  function current() { return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function refresh() { var next = current() === 'dark' ? 'claro' : 'oscuro'; btn.setAttribute('aria-label', 'Cambiar a modo ' + next); btn.title = 'Cambiar a modo ' + next; }
  btn.hidden = false; refresh();
  btn.addEventListener('click', function () {
    var t = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('avvlab_theme', t); } catch (e) {}
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', t === 'dark' ? '#1b1917' : '#f7f6f3'); });
    refresh();
  });
})();
</script>
</body>
</html>
