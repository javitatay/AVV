<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · AVV Lab</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f6f3">
<script>try{var t=localStorage.getItem("avvlab_theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute("content",t==="dark"?"#1b1917":"#f7f6f3")})}}catch(e){}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f6f3;--surface:#fff;--fg:#1f1d1a;--mid:#6f6b64;--stroke-c:#1f1d1a;--blue:#cbe6f7;--yellow:#f2da8e;--green:#d5e7d0;--pink:#f5cfcd;
  --sh-mix:100%;--blue-d:color-mix(in srgb,var(--blue) var(--sh-mix),#000);--green-d:color-mix(in srgb,var(--green) var(--sh-mix),#000);--yellow-d:color-mix(in srgb,var(--yellow) var(--sh-mix),#000);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;--ease-out:cubic-bezier(.23,1,.32,1);color-scheme:light}
:root[data-theme="dark"]{--bg:#1b1917;--surface:#262320;--fg:#f7f6f3;--mid:#b3aea4;--stroke-c:#a9a499;--sh-mix:52%;color-scheme:dark}
body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.5;min-height:100vh;display:grid;place-items:center;padding:24px}
main{max-width:560px;width:100%;background:var(--surface);border:2px solid var(--stroke-c);border-radius:20px;box-shadow:6px 6px 0 var(--pink);padding:32px 28px;text-align:center}
.code{display:inline-block;font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.08em;background:var(--pink);color:#1f1d1a;border:2px solid var(--stroke-c);border-radius:999px;padding:2px 12px;margin-bottom:16px}
h1{font-size:clamp(26px,6vw,36px);line-height:1.15;font-weight:800;margin-bottom:10px}
p{color:var(--mid);margin-bottom:24px}
nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{height:44px;display:inline-flex;align-items:center;gap:8px;background:var(--surface);color:var(--fg);border:2px solid var(--stroke-c);border-radius:12px;box-shadow:3px 3px 0 var(--blue-d);font-weight:700;font-size:15px;padding:0 16px;text-decoration:none;transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out)}
.btn.v{box-shadow:3px 3px 0 var(--green-d)}
.btn.c{box-shadow:3px 3px 0 var(--yellow-d)}
@media(hover:hover) and (pointer:fine){.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--blue-d)}.btn.v:hover{box-shadow:5px 5px 0 var(--green-d)}.btn.c:hover{box-shadow:5px 5px 0 var(--yellow-d)}}
.btn:active{transform:translate(2px,2px)}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <span class="code">ERROR 404</span>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté mal escrito o que la página haya cambiado de sitio.</p>
  <nav aria-label="Ir a">
    <a class="btn" href="/AVV/">Portada</a>
    <a class="btn v" href="/AVV/videos/">Vídeos</a>
    <a class="btn c" href="/AVV/imagen-video.html">Curso 3D · Imagen</a>
    <a class="btn c" href="/AVV/iluminacion-directo.html">Curso 3D · Iluminación</a>
  </nav>
</main>
</body>
</html>
