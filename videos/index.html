  --blue:#cbe6f7;--yellow:#f2da8e;--green:#d5e7d0;--pink:#f5cfcd;--on-pastel:#1f1d1a;
  --sh-mix:100%;
  --blue-d:color-mix(in srgb,var(--blue) var(--sh-mix),#000);
  --yellow-d:color-mix(in srgb,var(--yellow) var(--sh-mix),#000);
  --green-d:color-mix(in srgb,var(--green) var(--sh-mix),#000);
  --btn-bg:#1f1d1a;--btn-fg:#f7f6f3;--stage:#201e1b;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1);color-scheme:light}
:root[data-theme="dark"]{--bg:#1b1917;--surface:#262320;--fg:#f7f6f3;--mid:#b3aea4;--line:#38342f;--stroke-c:#a9a499;--btn-bg:var(--yellow);--btn-fg:#1f1d1a;--sh-mix:52%;color-scheme:dark}
@supports (color:oklch(from red l c h)){:root[data-theme="dark"]{--blue-d:oklch(from var(--blue) calc(l*.70) calc(c*2.0) h);--yellow-d:oklch(from var(--yellow) calc(l*.70) calc(c*2.0) h);--green-d:oklch(from var(--green) calc(l*.70) calc(c*2.0) h)}}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.5;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit}
.skip{position:absolute;left:-999px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--stroke-c)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.btn{height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--fg);border:2px solid var(--stroke-c);border-radius:12px;box-shadow:3px 3px 0 var(--green-d);font-weight:700;font-size:14px;padding:0 14px;text-decoration:none;cursor:pointer;touch-action:manipulation;transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out)}
.btn svg{width:16px;height:16px;flex-shrink:0}
@media(hover:hover) and (pointer:fine){.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--green-d)}}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stroke-c)}
.btn.sq{width:40px;padding:0}
.btn.y{box-shadow:3px 3px 0 var(--yellow-d)}
.btn:focus-visible,.chap:focus-visible,.vc:focus-visible,video:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--font-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--font-mono);font-size:11px;color:var(--mid);letter-spacing:.08em;text-transform:uppercase}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 56px}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:start}
.phone{position:relative;background:var(--stage);border:2px solid var(--stroke-c);border-radius:22px;box-shadow:8px 8px 0 var(--blue-d);overflow:hidden;aspect-ratio:9/16;height:min(78vh,780px);max-width:100%}
.phone video{width:100%;height:100%;display:block;background:var(--stage);object-fit:contain}
.info{display:flex;flex-direction:column;gap:18px;min-width:0}
.kicker{display:inline-flex;align-self:flex-start;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--yellow);color:var(--on-pastel);border:2px solid var(--stroke-c);border-radius:8px;padding:3px 10px;box-shadow:3px 3px 0 var(--yellow-d)}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,4.6vw,3.4rem);letter-spacing:-.035em;line-height:1}
.sub{color:var(--mid);font-size:1.05rem;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-mono);font-size:12px;font-weight:700;border:2px solid var(--stroke-c);border-radius:999px;padding:2px 10px;background:var(--surface)}
.h2{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
.chaps{display:flex;flex-direction:column;gap:8px}
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--stroke-c);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;box-shadow:3px 3px 0 var(--line);touch-action:manipulation;transition:background 120ms,box-shadow 120ms,transform 100ms var(--ease-out)}
.chap time{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--mid);min-width:40px}
.chap .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--stroke-c);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:700;flex-shrink:0}
.chap.on{background:var(--blue);color:var(--on-pastel);box-shadow:3px 3px 0 var(--blue-d)}
.chap.on time{color:var(--on-pastel)}
@media(hover:hover) and (pointer:fine){.chap:hover{transform:translate(-1px,-1px)}}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:13px;color:var(--mid)}
.sec{display:flex;align-items:center;gap:14px;margin:48px 0 20px}
.sec h2{font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:-.025em;white-space:nowrap}
.sec i{flex:1;height:2px;background:var(--stroke-c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 22px}
.vc{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:2px solid var(--stroke-c);border-radius:16px;box-shadow:6px 6px 0 var(--line);overflow:hidden;cursor:pointer;padding:0;touch-action:manipulation;transition:transform 140ms var(--ease-out),box-shadow 140ms var(--ease-out)}
.vc .im{position:relative;aspect-ratio:540/505;overflow:hidden;background:var(--stage);border-bottom:2px solid var(--stroke-c)}
.vc .im img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.vc .num{position:absolute;left:10px;top:10px;font-family:var(--font-mono);font-size:12px;font-weight:700;background:var(--yellow);color:var(--on-pastel);border:2px solid var(--stroke-c);border-radius:8px;padding:1px 8px}
.vc .dur{position:absolute;right:10px;bottom:10px;font-family:var(--font-mono);font-size:12px;font-weight:700;background:rgba(0,0,0,.72);color:#fff;border-radius:6px;padding:1px 7px}
.vc .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.vc .tx b{font-family:var(--font-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;line-height:1.1}
.vc .tx span{font-size:12.5px;color:var(--mid);font-weight:500}
.vc[aria-current="true"]{box-shadow:6px 6px 0 var(--blue-d);background:var(--blue);color:var(--on-pastel)}
.vc[aria-current="true"] .tx span{color:var(--on-pastel);opacity:.75}
@media(hover:hover) and (pointer:fine){.vc:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--blue-d)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--btn-bg);color:var(--btn-fg);font-weight:700;font-size:14px;padding:10px 18px;border-radius:12px;transition:opacity 160ms,transform 160ms var(--ease-out);z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){
  .stage{grid-template-columns:1fr;gap:24px}
  .phone{height:auto;width:min(100%,380px);margin:0 auto;aspect-ratio:9/16;max-height:78vh;width:auto;max-width:100%}
  .phone{height:min(74vh,640px)}
  .stage>.pw{display:flex;justify-content:center}
  .wrap{padding:20px 16px 48px}
  .top-in{padding:8px 14px}
  .btn .lb{display:none}
}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}.vc{box-shadow:4px 4px 0 var(--line)}.vc .tx b{font-size:1rem}.vc .tx span{font-size:11.5px}.sec h2{font-size:1.35rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header class="top"><div class="top-in">
  <a class="btn" href="../index.html" aria-label="Volver a AVV Lab"><svg viewBox="0 0 16 16" fill="none"><path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lb">AVV Lab</span></a>
  <div class="brand"><b>Vídeos explicativos</b><span>Imagen y vídeo · UD 3</span></div>
  <button class="btn sq y" id="theme" aria-label="Cambiar tema claro u oscuro"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
</div></header>
<main class="wrap" id="main">
  <section class="stage" aria-label="Reproductor">
    <div class="pw"><div class="phone"><video id="v" controls playsinline preload="metadata" aria-label="Vídeo explicativo"></video></div></div>
    <div class="info">
      <span class="kicker" id="k">Vídeo 1 de 8</span>
      <div><h1 id="t"></h1><p class="sub" id="s"></p></div>
      <div class="meta"><span class="chip" id="d"></span><span class="chip">Sin audio</span><span class="chip">Vertical 9:16</span></div>
      <div><p class="h2" style="margin-bottom:10px">Capítulos</p><div class="chaps" id="ch"></div></div>
      <div class="acts">
        <button class="btn" id="prev"><svg viewBox="0 0 16 16" fill="none"><path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Anterior</button>
        <button class="btn" id="next">Siguiente<svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="btn y" id="copy"><svg viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 10.5V4a1 1 0 011-1h6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Copiar enlace</button>
      </div>
      <p class="note">«Copiar enlace» da la URL directa a este vídeo, la que se pega en el botón de Google Slides.</p>
    </div>
  </section>
  <div class="sec"><h2>Los 8 vídeos</h2><i></i></div>
  <div class="grid" id="g"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var V=[{"id":"brillo","t":"Brillo y contraste","s":"Lúmenes, lux, ANSI, gamma y HDR","d":105,"c":[["Lúmenes y lux",4],["ANSI, ISO y «LED»",39],["Contraste, gamma y HDR",69]]},{"id":"throw-ratio","t":"Throw ratio","s":"Ópticas y distancia de proyección","d":101,"c":[["La óptica",4],["Qué es el throw ratio",24],["Tipos de tiro",54],["Lentes con zoom",80]]},{"id":"keystone","t":"Keystone y lens shift","s":"Encajar la imagen en la pantalla","d":111,"c":[["El problema",4],["Keystone",18],["Lens shift",39],["Corrección de esquinas",61],["Focus, zoom y crop",84]]},{"id":"tecnologias","t":"LCD, DLP y láser","s":"Tecnologías de proyector y HDBaseT","d":106,"c":[["LCD",4],["DLP",20],["Láser",44],["¿Cuál elegir?",60],["HDBaseT",69]]},{"id":"pantallas-led","t":"Pantallas LED","s":"Del píxel a la pantalla, y cómo se calcula","d":107,"c":[["Cómo es",4],["Pixel pitch",27],["Cálculo paso a paso",52],["La controladora",85]]},{"id":"nits","t":"Nits y refresco","s":"El brillo y la estabilidad de una pantalla LED","d":93,"c":[["Nits",4],["Lúmenes ≠ nits",28],["Tasa de refresco",53]]},{"id":"mapping","t":"Mapping y blending","s":"Grid, warping y unión de proyectores","d":101,"c":[["Video mapping",4],["Grid",21],["Warping",38],["Blending",54]]},{"id":"pixel-mapping","t":"Pixel mapping","s":"Pantallas LED, DMX y Art-Net","d":101,"c":[["La idea",4],["En pantallas LED",21],["DMX: canales y universos",46],["Art-Net y sACN",78]]}];
var $=function(i){return document.getElementById(i)},v=$('v'),cur=0;
function mm(s){s=Math.round(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function idx(){var h=decodeURIComponent(location.hash.slice(1));for(var i=0;i<V.length;i++)if(V[i].id===h)return i;return 0}
function grid(){$('g').innerHTML=V.map(function(x,i){return '<button class="vc" data-i="'+i+'"><span class="im"><img src="posters/'+x.id+'-thumb.jpg" alt="" loading="lazy" width="540" height="505"><span class="num">'+('0'+(i+1)).slice(-2)+'</span><span class="dur">'+mm(x.d)+'</span></span><span class="tx"><b>'+x.t+'</b><span>'+x.s+'</span></span></button>'}).join('')}
function show(i,fromHash){
  cur=i;var x=V[i];
  v.pause();v.src=''+x.id+'.mp4';v.poster='posters/'+x.id+'.jpg';
  $('k').textContent='Vídeo '+(i+1)+' de '+V.length;$('t').textContent=x.t;$('s').textContent=x.s;$('d').textContent=mm(x.d);
  document.title=x.t+' · Vídeos · AVV Lab';
  $('ch').innerHTML=x.c.map(function(c,j){return '<button class="chap" data-t="'+c[1]+'"><span class="n">'+(j+1)+'</span><span style="flex:1">'+c[0]+'</span><time>'+mm(c[1])+'</time></button>'}).join('');
  $('prev').disabled=i===0;$('next').disabled=i===V.length-1;
  $('prev').style.opacity=i===0?.4:1;$('next').style.opacity=i===V.length-1?.4:1;
  [].forEach.call(document.querySelectorAll('.vc'),function(b,j){if(j===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
  mark(0);
  if(!fromHash&&location.hash!=='#'+x.id)history.replaceState(null,'','#'+x.id);
}
function mark(t){var c=V[cur].c,a=0;for(var j=0;j<c.length;j++)if(t>=c[j][1]-.3)a=j;[].forEach.call($('ch').children,function(b,j){b.classList.toggle('on',j===a)})}
v.addEventListener('timeupdate',function(){mark(v.currentTime)});
$('ch').addEventListener('click',function(e){var b=e.target.closest('.chap');if(!b)return;v.currentTime=+b.dataset.t;v.play().catch(function(){})});
$('g').addEventListener('click',function(e){var b=e.target.closest('.vc');if(!b)return;show(+b.dataset.i);window.scrollTo({top:0,behavior:'smooth'})});
$('prev').onclick=function(){if(cur>0)show(cur-1)};
$('next').onclick=function(){if(cur<V.length-1)show(cur+1)};
v.addEventListener('ended',function(){if(cur<V.length-1){$('next').style.boxShadow='3px 3px 0 var(--yellow-d)';$('next').focus({preventScroll:true})}});
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},1800)}
$('copy').onclick=function(){var u=location.origin+location.pathname+'#'+V[cur].id;if(location.protocol==='file:')u=location.href.split('#')[0]+'#'+V[cur].id;
  function ok(){toast('Enlace copiado')}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(ok,function(){fb()})}else fb();
  function fb(){var a=document.createElement('textarea');a.value=u;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast(u)}a.remove()}};
$('theme').onclick=function(){var d=document.documentElement,n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);try{localStorage.setItem('avvlab_theme',n)}catch(e){}document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',n==='dark'?'#1b1917':'#f7f6f3')})};
window.addEventListener('hashchange',function(){var i=idx();if(i!==cur)show(i,true)});
grid();show(idx(),true);
</script>
</body>
