/* Iluminación en directo · aspecto AVV Lab: crema, tinta, pasteles planos con contorno grueso y sombra desplazada. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:#f7f6f3; --surface:#ffffff; --fg:#1f1d1a; --mid:#6f6b64; --line:#e6e2da;
  --stroke-c:#1f1d1a; --hover:rgba(31,29,26,.05); --focus:#1f1d1a;
  --blue:#cbe6f7; --yellow:#f2da8e; --green:#d5e7d0; --pink:#f5cfcd;
  --on-pastel:#1f1d1a; --on-pastel-2:#4a463f; --obj-stroke:#1f1d1a; --band-surface:#ffffff;
  --hi:#f2da8e; --hi-fg:#1f1d1a;
  --sh-mix:100%;
  --blue-d:color-mix(in srgb,var(--blue) var(--sh-mix),#000);
  --yellow-d:color-mix(in srgb,var(--yellow) var(--sh-mix),#000);
  --green-d:color-mix(in srgb,var(--green) var(--sh-mix),#000);
  --pink-d:color-mix(in srgb,var(--pink) var(--sh-mix),#000);
  --ill-s-b:#1f1d1a; --ill-s-y:#1f1d1a; --ill-s-g:#1f1d1a; --ill-s-p:#1f1d1a;
  --ill-f-b:var(--blue); --ill-f-y:var(--yellow); --ill-f-g:var(--green); --ill-f-p:var(--pink);
  --btn-bg:#1f1d1a; --btn-fg:#f7f6f3;
  --good:#2f6b3a; --bad:#a33a30;
  --stage:#0a0c13;
  --radius:16px; --offset:8px; --max:1240px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1b1917; --surface:#262320; --fg:#f7f6f3; --mid:#b3aea4; --line:#38342f;
  --stroke-c:#a9a499; --hover:rgba(247,246,243,.07); --focus:#f7f6f3;
  --btn-bg:var(--yellow); --btn-fg:#1f1d1a; --sh-mix:52%;
  --ill-s-b:var(--blue); --ill-s-y:var(--yellow); --ill-s-g:var(--green); --ill-s-p:var(--pink);
  --ill-f-b:var(--blue-d); --ill-f-y:var(--yellow-d); --ill-f-g:var(--green-d); --ill-f-p:var(--pink-d);
  --good:#8fd39a; --bad:#ff9d90;
  color-scheme:dark;
}
@supports (color: oklch(from red l c h)){
  :root[data-theme="dark"]{
    --blue-d:oklch(from var(--blue) calc(l * .70) calc(c * 2.0) h);
    --yellow-d:oklch(from var(--yellow) calc(l * .70) calc(c * 2.0) h);
    --green-d:oklch(from var(--green) calc(l * .70) calc(c * 2.0) h);
    --pink-d:oklch(from var(--pink) calc(l * .70) calc(c * 2.0) h);
  }
  :root[data-theme="dark"] .card{--tint-d:oklch(from var(--tint) calc(l * .70) calc(c * 2.0) h)}
}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .hero-stat{border-color:var(--tint)}

/* Lo que va sobre un pastel usa tinta oscura en claro y en oscuro */
.card-top,.card-ud,.card-btn,.hero-stat,.topbar-badge,.opt[aria-pressed="true"],.tabs button[aria-selected="true"],.read.hot,.skip-link,.side a[aria-current="page"],.kicker,.exercise .tag,.widget .wtag,.card .ok{
  --fg:var(--on-pastel); --mid:var(--on-pastel-2); --surface:var(--band-surface); --stroke-c:var(--obj-stroke); --focus:var(--on-pastel); color:var(--fg);
}

html{scroll-behavior:smooth}
body{font-family:var(--font);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.6;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
::selection{background:var(--hi);color:var(--hi-fg)}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
strong{font-weight:700}
a{color:var(--fg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono)}

/* ---------- Barra superior ---------- */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,calc((100% - var(--max))/2 + 16px));min-height:64px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);flex-shrink:1;min-width:0}
.brand>span:last-child{min-width:0}
.brand-logo{width:44px;height:37px;flex-shrink:0}
.brand-logo svg{display:block;width:100%;height:100%;overflow:visible}
.brand-name{font-family:var(--font-display);font-size:1.25rem;font-weight:800;letter-spacing:-.025em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:var(--mid);margin-top:2px;white-space:nowrap}
.topnav{display:flex;gap:6px;margin-left:10px}
.topnav a{font-size:13.5px;font-weight:700;text-decoration:none;padding:5px 14px;border-radius:999px;border:2px solid transparent;transition:background-color 150ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){.topnav a:hover{background:var(--hover)}}
.topnav a[aria-current="page"]{background:var(--yellow);color:var(--on-pastel);border-color:var(--obj-stroke)}
.spacer{flex:1}
.topbar-badge{font-size:12px;font-weight:700;color:var(--fg);background:var(--yellow);border:2px solid var(--stroke-c);border-radius:999px;padding:2px 12px;white-space:nowrap}
.menu-btn,.home-btn,.theme-toggle,.pill{flex-shrink:0}
.pill{font-family:var(--font-mono);font-size:12.5px;font-weight:700;padding:3px 12px;border:2px solid var(--stroke-c);border-radius:999px;background:var(--surface);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu-btn,.theme-toggle,.home-btn{height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--fg);border:2px solid var(--stroke-c);border-radius:12px;box-shadow:3px 3px 0 var(--blue-d);font-weight:700;font-size:14px;padding:0 12px;transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out);touch-action:manipulation}
.theme-toggle{width:40px;padding:0;box-shadow:3px 3px 0 var(--yellow-d)}
.home-btn{display:none;width:40px;padding:0;text-decoration:none;box-shadow:3px 3px 0 var(--green-d)}
.theme-toggle[hidden]{display:none}
.theme-toggle::before{content:"";width:18px;height:18px;border:2px solid var(--fg);border-radius:50%;background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)}
@media (hover:hover) and (pointer:fine){.menu-btn:hover,.theme-toggle:hover,.home-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--blue-d)}.theme-toggle:hover{box-shadow:5px 5px 0 var(--yellow-d)}.home-btn:hover{box-shadow:5px 5px 0 var(--green-d)}}
.menu-btn:active,.theme-toggle:active,.home-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stroke-c)}
.skip-link{position:absolute;top:-56px;left:12px;z-index:1000;background:var(--yellow);color:var(--on-pastel);border:2px solid var(--obj-stroke);text-decoration:none;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:top 150ms var(--ease-out)}
.skip-link:focus{top:12px}

/* ---------- Índice (cajón) ---------- */
.side{position:fixed;top:64px;bottom:0;left:0;z-index:30;width:min(360px,92vw);overflow:auto;padding:18px 14px 32px 16px;background:var(--bg);border-right:2px solid var(--stroke-c);transform:translateX(-102%);transition:transform .2s var(--ease-out)}
body.menu-open .side{transform:none;box-shadow:8px 0 0 var(--blue-d)}
.scrim{position:fixed;inset:64px 0 0 0;z-index:25;background:rgba(20,18,16,.55);backdrop-filter:blur(3px);display:none}
body.menu-open .scrim{display:block}
.side h3{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mid);margin:20px 8px 8px}
.side h3:first-child{margin-top:0}
.side a.side-home{margin-bottom:14px;padding:8px 12px;border:2px solid var(--stroke-c);border-radius:999px;font-weight:700;font-size:14px;background:var(--surface);box-shadow:3px 3px 0 var(--green-d);align-items:center}
.side a.side-home svg{flex:none}
.side a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:10px;border:2px solid transparent;text-decoration:none;font-size:14.5px;font-weight:500;line-height:1.35}
@media (hover:hover) and (pointer:fine){.side a:hover{background:var(--hover)}}
.side a[aria-current="page"]{background:var(--yellow);border-color:var(--obj-stroke);font-weight:700}
.side .num{font-family:var(--font-mono);font-size:12px;color:var(--mid);min-width:1.7em;font-variant-numeric:tabular-nums}
.side .tick{margin-left:auto;color:var(--good);font-weight:700}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:12px;border:2px solid var(--stroke-c);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;font-weight:700;font-size:14px;box-shadow:4px 4px 0 var(--blue-d);transition:transform 110ms var(--ease-out),box-shadow 110ms var(--ease-out);touch-action:manipulation}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:4px 4px 0 var(--yellow-d)}
.btn.primary{--fg:var(--btn-fg)}
.btn.small{padding:5px 13px;font-size:13px;box-shadow:3px 3px 0 var(--blue-d)}
.btn.small.primary{box-shadow:3px 3px 0 var(--yellow-d)}
@media (hover:hover) and (pointer:fine){.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--blue-d)}.btn.primary:hover{box-shadow:6px 6px 0 var(--yellow-d)}.btn.small:hover{box-shadow:4px 4px 0 var(--blue-d)}.btn.small.primary:hover{box-shadow:4px 4px 0 var(--yellow-d)}}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--stroke-c)}
.btn[aria-pressed="true"]{background:var(--green);--fg:var(--on-pastel);color:var(--on-pastel);border-color:var(--obj-stroke)}

/* ---------- Inicio ---------- */
.hero{max-width:var(--max);margin:0 auto;padding:44px 32px 52px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:48px;align-items:center;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.1rem);line-height:.98;letter-spacing:-.035em;margin-bottom:18px}
.hero h1 em{font-style:normal;text-decoration:underline;text-decoration-color:var(--hi);text-decoration-thickness:.11em;text-underline-offset:.1em;text-decoration-skip-ink:none}
.hero-sub{font-size:1.05rem;color:var(--mid);max-width:50ch;margin-bottom:24px}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin-bottom:28px}
.hero-stat{--tint:var(--blue);display:flex;align-items:baseline;gap:6px;background:var(--tint);color:var(--fg);border:2px solid var(--stroke-c);border-radius:999px;padding:3px 14px}
.hero-stats .hero-stat:nth-child(2){--tint:var(--yellow)}.hero-stats .hero-stat:nth-child(3){--tint:var(--green)}.hero-stats .hero-stat:nth-child(4){--tint:var(--pink)}
.hero-stat-n{font-family:var(--font-display);font-size:1.3rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-stat-l{font-size:.85rem;font-weight:600}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px}
.frame{position:relative;border:2px solid var(--stroke-c);border-radius:var(--radius);overflow:hidden;background:#05060a;box-shadow:var(--offset) var(--offset) 0 var(--blue-d)}
.hero-art{aspect-ratio:4/3.1;width:100%}
.hero-art .viewer{position:absolute;inset:0;height:100%;border:0;border-radius:0}
.hero-fallback{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg)}
.hero-fallback svg{width:60%;height:auto;overflow:visible}

.section-header{max-width:var(--max);margin:0 auto;padding:40px 32px 22px;display:flex;align-items:center;gap:16px}
.section-title{font-family:var(--font-display);font-size:1.65rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.section-sub{font-size:13.5px;color:var(--mid);white-space:nowrap}
.section-line{flex:1;height:0;border-top:2px dashed var(--line)}
.grid{max-width:var(--max);margin:0 auto;padding:0 40px 24px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 26px}
.card{--tint:var(--blue);--tint-d:color-mix(in srgb,var(--tint) var(--sh-mix),#000);position:relative;background:var(--surface);color:var(--fg);border:2px solid var(--stroke-c);border-radius:var(--radius);text-decoration:none;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--offset) var(--offset) 0 var(--tint-d);transition:transform 140ms var(--ease-out),box-shadow 140ms var(--ease-out);animation:rise 420ms var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (hover:hover) and (pointer:fine){.card:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 var(--tint-d)}}
.card:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--tint-d)}
.card.t2{--tint:var(--yellow)}.card.t3{--tint:var(--green)}.card.t4{--tint:var(--pink)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--tint);border-bottom:2px solid var(--stroke-c)}
.card-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:2px solid var(--stroke-c);border-radius:12px;font-size:1.35rem;line-height:1}
.card-ud{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--surface);border:2px solid var(--stroke-c);border-radius:6px;padding:1px 8px;transform:rotate(-2deg);white-space:nowrap}
.card-body{padding:14px 18px 8px;flex:1}
.card-title{font-family:var(--font-display);font-size:1.22rem;font-weight:800;letter-spacing:-.02em;line-height:1.12}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 18px;padding:12px 0 16px;border-top:2px dashed var(--line)}
.card-tag{font-size:12px;font-weight:600;padding:0 9px;border-radius:999px;color:var(--mid);border:1.5px solid var(--line)}
.card-tag.on{color:var(--fg);border-color:var(--stroke-c)}
.card-btn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;background:var(--tint);color:var(--fg);border:2px solid var(--stroke-c);border-radius:999px;padding:1px 12px;transition:gap 140ms var(--ease-out)}
.card:hover .card-btn{gap:9px}
.card .ok{position:absolute;right:-2px;top:-2px;z-index:2;background:var(--green);color:var(--on-pastel);border:2px solid var(--obj-stroke);border-radius:0 0 0 10px;padding:0 9px;font-weight:800;font-size:13px}
.footer{text-align:center;padding:30px 32px 36px;font-size:13px;color:var(--mid);border-top:1px solid var(--line);margin-top:40px}
.footer p+p{margin-top:3px}.footer strong{color:var(--fg)}.footer a{font-weight:700}

/* ---------- Visor 3D ---------- */
.viewer{position:relative;background:#05060a;overflow:hidden;touch-action:none;min-height:260px}
.viewer canvas{display:block;width:100%;height:100%;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.hud{position:absolute;left:14px;top:14px;display:grid;gap:2px;color:#fff;pointer-events:none;text-shadow:0 1px 8px #000;max-width:72%}
.hud b{font-family:var(--font-display);font-size:clamp(1.1rem,2.6vw,1.6rem);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.hud span{font-size:.88rem;color:#cfd5e6}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:.76rem;color:#c5cce0;background:#000a;padding:4px 12px;border-radius:999px;pointer-events:none;white-space:normal;text-align:center;max-width:92%;transition:opacity .6s}
.vbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.vbtns button{width:36px;height:36px;border-radius:50%;border:2px solid #ffffff55;background:#0a0c13d0;color:#fff;cursor:pointer;font-size:1rem}
.vbtns button:hover{border-color:var(--yellow)}
.nogl{padding:18px}

/* ---------- Lección ---------- */
.lpage{max-width:var(--max);margin:0 auto;padding:24px 32px 60px}
.lhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:22px}
.lhead h1{font-size:clamp(1.55rem,3.4vw,2.3rem)}
.kicker{font-family:var(--font-mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--yellow);color:var(--fg);border:2px solid var(--stroke-c);border-radius:6px;padding:1px 9px;transform:rotate(-2deg);white-space:nowrap;display:inline-block}
.lgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(310px,1fr);gap:30px;align-items:start}
.lgrid .viewer{height:clamp(320px,64vh,680px);border:2px solid var(--stroke-c);border-radius:var(--radius);box-shadow:var(--offset) var(--offset) 0 var(--blue-d)}
.lmain{display:grid;gap:26px;min-width:0}
.dock{background:var(--surface);border:2px solid var(--stroke-c);border-radius:var(--radius);box-shadow:var(--offset) var(--offset) 0 var(--yellow-d);overflow:hidden;min-width:0;position:sticky;top:78px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-bottom:2px dashed var(--line)}
.tabs button{font-size:12.5px;font-weight:700;padding:3px 14px;border-radius:999px;cursor:pointer;border:2px solid var(--stroke-c);background:var(--surface);transition:transform 100ms var(--ease-out),background-color 150ms var(--ease-out);touch-action:manipulation}
@media (hover:hover) and (pointer:fine){.tabs button[aria-selected="false"]:hover{background:var(--blue);color:var(--on-pastel);border-color:var(--obj-stroke)}}
.tabs button:active{transform:scale(.96)}
.tabs button[aria-selected="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--yellow-d)}
.pane{padding:16px;overflow:auto;min-height:0}
.keys{list-style:none;display:grid;gap:14px}
.keys li{display:flex;gap:12px;align-items:flex-start;font-size:1.02rem;line-height:1.45;font-weight:500}
.keys li::before{content:"";flex:none;width:16px;height:16px;margin-top:.28em;border-radius:50%;border:2px solid var(--stroke-c);background:var(--blue)}
.keys li:nth-child(2)::before{background:var(--yellow)}.keys li:nth-child(3)::before{background:var(--green)}.keys li:nth-child(4)::before{background:var(--pink)}
.lede2{color:var(--mid);margin:0 0 16px;font-size:.95rem}
.dockfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px;border-top:2px dashed var(--line)}
.extras{display:grid;gap:26px}
.pane .prose{max-width:none;font-size:.95rem}
.pane .prose h2{font-size:1.2rem;margin:24px 0 8px}
.pane .quiz{margin:0;border:0;padding:0}
.pane .reads{grid-template-columns:repeat(2,1fr)}

/* ---------- Texto de apuntes ---------- */
.prose{max-width:68ch}
.prose h2{font-size:1.4rem;margin:32px 0 10px}
.prose h3{font-size:1.1rem;margin:22px 0 6px}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 14px;padding-left:1.2em}.prose li{margin:3px 0}
.callout{border:2px solid var(--stroke-c);border-left-width:8px;background:color-mix(in srgb,var(--yellow) 32%,var(--surface));padding:12px 16px;border-radius:12px;margin:18px 0}
.callout.cool{background:color-mix(in srgb,var(--blue) 40%,var(--surface))}
.callout p{margin:0}
.tbl-wrap{overflow-x:auto;margin:14px 0 20px;border:2px solid var(--stroke-c);border-radius:12px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--blue);color:var(--on-pastel);font-weight:700;font-size:.8rem;letter-spacing:.02em;border-bottom:2px solid var(--stroke-c)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:700}
.formula{font-family:var(--font-mono);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;display:block;overflow-x:auto}
.exercise{border:2px dashed var(--stroke-c);border-radius:12px;padding:14px 18px;margin:22px 0;background:var(--surface)}
.exercise .tag{font-family:var(--font-mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--green);color:var(--on-pastel);border:2px solid var(--obj-stroke);border-radius:6px;padding:0 8px}
.exercise p{margin:8px 0 0}.exercise ul,.exercise ol{margin:6px 0 0;padding-left:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:3px 14px;border:2px solid var(--stroke-c);border-radius:999px;background:var(--surface);font-size:.9rem;font-weight:600}
.chip:nth-child(4n+1){background:var(--blue);color:var(--on-pastel)}.chip:nth-child(4n+2){background:var(--yellow);color:var(--on-pastel)}.chip:nth-child(4n+3){background:var(--green);color:var(--on-pastel)}.chip:nth-child(4n){background:var(--pink);color:var(--on-pastel)}

/* ---------- Simuladores y controles ---------- */
.widget{border:2px solid var(--stroke-c);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--offset) var(--offset) 0 var(--blue-d)}
.widget>header{padding:16px 20px 0}
.widget .wtag{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--blue);color:var(--on-pastel);border:2px solid var(--obj-stroke);border-radius:6px;padding:0 8px;transform:rotate(-2deg);margin-bottom:8px}
.widget h3{font-size:1.25rem;margin:2px 0 4px}
.widget .wnote{margin:0 0 6px;color:var(--mid);font-size:.92rem}
.wbody{padding:12px 20px 20px;display:grid;gap:14px}
.pane .widget{border:0;box-shadow:none}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 24px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:.88rem}
.ctl-l{color:var(--mid);font-weight:500}
.ctl-o{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:.85rem;text-align:right}
.ctl input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:var(--bg);border:2px solid var(--stroke-c)}
input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:var(--bg);border:2px solid var(--stroke-c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--yellow);border:2px solid var(--obj-stroke);box-shadow:2px 2px 0 var(--obj-stroke)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--yellow);border:2px solid var(--obj-stroke);box-shadow:2px 2px 0 var(--obj-stroke)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-size:13px;font-weight:700;padding:3px 14px;border-radius:999px;cursor:pointer;border:2px solid var(--stroke-c);background:var(--surface);transition:transform 100ms var(--ease-out),background-color 150ms var(--ease-out);touch-action:manipulation}
@media (hover:hover) and (pointer:fine){.opt[aria-pressed="false"]:hover,.opt:not([aria-pressed]):hover{background:var(--blue);color:var(--on-pastel);border-color:var(--obj-stroke)}}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--yellow-d)}
.stage{background:var(--stage);color:#e8ebf4;border:2px solid var(--stroke-c);border-radius:12px;overflow:hidden;position:relative}
.stage canvas,.stage svg{display:block;width:100%;height:auto}
.stage .cap{padding:8px 12px;font-size:.82rem;color:#8d97ad;border-top:1px solid #1d2230}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.read{background:var(--surface);border:2px solid var(--stroke-c);border-radius:12px;padding:7px 12px;box-shadow:3px 3px 0 var(--blue-d)}
.read b{display:block;font-family:var(--font-mono);font-size:1.12rem;font-weight:700;font-variant-numeric:tabular-nums}
.read span{font-size:.76rem;color:var(--mid);font-weight:500}
.read.hot{background:var(--yellow);box-shadow:3px 3px 0 var(--yellow-d)}
.read.txt{grid-column:1/-1}
.read.txt b{font-family:var(--font);font-size:.98rem;font-weight:700;line-height:1.4}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;font-size:.86rem;font-weight:500}
.barrow .track{height:16px;background:var(--bg);border:2px solid var(--stroke-c);border-radius:999px;overflow:hidden}
.barrow .fill{height:100%;background:var(--yellow);border-right:2px solid var(--obj-stroke);transition:width .15s}
.barrow .fill.cool{background:var(--blue)}
.barrow .val{font-family:var(--font-mono);font-weight:700;font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:.84rem;color:var(--mid);margin:0}
.swatch{height:90px;border-radius:12px;border:2px solid var(--stroke-c)}
.specbar{position:relative;height:46px;border-radius:10px;border:2px solid var(--stroke-c)}
.specbar .mark{position:absolute;top:-8px;bottom:-8px;width:4px;background:#fff;box-shadow:0 0 0 2px #000;border-radius:2px}
.specscale{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.74rem;color:var(--mid)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:.9rem}
.dl dt{color:var(--mid);font-weight:600}.dl dd{margin:0}
input[type=number],select,input[type=text]{font:inherit;padding:6px 10px;border:2px solid var(--stroke-c);border-radius:10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=number]{width:96px;font-family:var(--font-mono)}
.dmxtbl{font-family:var(--font-mono);font-size:.82rem}.dmxtbl td:first-child{font-weight:700}
.dip{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:44px;border:2px solid var(--stroke-c);border-radius:10px;background:var(--surface);padding:6px 0 4px;cursor:pointer;display:grid;gap:4px;justify-items:center;font-family:var(--font-mono);font-size:.72rem;font-weight:700}
.sw i{display:block;width:22px;height:30px;border-radius:4px;background:var(--stage);position:relative}
.sw i::after{content:"";position:absolute;left:3px;right:3px;height:12px;border-radius:2px;background:#8d97ad;top:15px;transition:top .1s}
.sw[aria-pressed="true"] i::after{top:3px;background:var(--yellow)}
.bits{display:flex;gap:4px}
.bits span{width:26px;text-align:center;font-family:var(--font-mono);font-weight:700;padding:4px 0;border-radius:6px;background:var(--bg);border:2px solid var(--line)}
.bits span.on{background:var(--blue);color:var(--on-pastel);border-color:var(--obj-stroke)}
.check{display:grid;gap:10px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--stroke-c);border-radius:12px;cursor:pointer;background:var(--surface)}
.check input{margin-top:4px;accent-color:var(--good);width:18px;height:18px;flex:none}
.check label:has(input:checked){background:var(--green);color:var(--on-pastel);border-color:var(--obj-stroke)}
.progress{height:14px;background:var(--bg);border:2px solid var(--stroke-c);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--green);border-right:2px solid var(--obj-stroke);transition:width .2s}
.rowed{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 36px;gap:8px;align-items:center}
.rowed input[type=number]{width:100%}
.x{border:2px solid var(--stroke-c);background:var(--surface);border-radius:10px;cursor:pointer;height:34px;font-weight:700}
.x:hover{background:var(--pink);color:var(--on-pastel)}
.frow{display:grid;grid-template-columns:54px 1fr 34px;gap:8px;align-items:center;font-size:.8rem;padding:3px 0}
.frow .own{grid-column:1/-1;font-size:.74rem;color:var(--mid);margin:-4px 0 2px 62px}
.frow .own.bad{color:var(--bad);font-weight:700}

/* ---------- Cuestionario ---------- */
.quiz{margin:36px 0 0;border-top:2px solid var(--stroke-c);padding-top:18px}
.q{margin:16px 0;padding:14px 16px;border:2px solid var(--stroke-c);border-radius:12px;background:var(--surface);box-shadow:4px 4px 0 var(--blue-d)}
.q p{margin:0 0 10px;font-weight:700}
.q .answers{display:grid;gap:8px}
.q button.a{text-align:left;padding:8px 12px;border:2px solid var(--stroke-c);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500}
@media (hover:hover) and (pointer:fine){.q button.a:hover:not(:disabled){background:var(--blue);color:var(--on-pastel);border-color:var(--obj-stroke)}}
.q button.a.ok{background:var(--green);color:var(--on-pastel);border-color:var(--obj-stroke);font-weight:700}
.q button.a.no{background:var(--pink);color:var(--on-pastel);border-color:var(--obj-stroke)}
.q .why{margin:10px 0 0;font-size:.9rem;color:var(--mid);font-weight:400}
.score{font-family:var(--font-mono);font-weight:700;font-size:.9rem}

/* ---------- Compat. y móvil ---------- */
.compo{max-width:var(--max);margin:0 auto;padding:24px 32px 60px}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:28px;padding:28px 18px 40px}
  .hero-art{order:-1;aspect-ratio:4/3}
  .grid,.section-header,.lpage,.compo{padding-left:18px;padding-right:22px}

  .lgrid .viewer{height:min(52vh,460px)}
  .dock{position:static;max-height:none}
  .topnav,.topbar-badge,.brand-sub{display:none}
  .home-btn{display:inline-flex}
  .barrow{grid-template-columns:84px 1fr 86px}

}
@media (max-width:560px){
  .topbar{gap:8px}
  .menu-btn .mt{display:none}
  .brand-name{font-size:1rem;white-space:normal;overflow:visible}
  .brand-sub{display:none}

  .pill{font-size:12px;padding:2px 9px}
}

<script>
const LOGO_SVG = '<svg viewBox="-4 -4 410 342" role="presentation" focusable="false"><g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="16"><g style="stroke:var(--ill-s-b)"><rect x="13" y="13" width="387" height="203" rx="22" style="fill:var(--ill-f-b)" stroke="none"/><rect x="0" y="0" width="387" height="203" rx="22"/></g><g style="stroke:var(--ill-s-y)"><path d="M206 60L128 176L284 176Z" style="fill:var(--ill-f-y)" stroke="none" transform="translate(13 13)"/><path d="M193 47L115 163L271 163Z"/><circle cx="193" cy="34" r="14" style="fill:var(--ill-f-y)"/></g><g style="stroke:var(--ill-s-y)"><rect x="13" y="248" width="120" height="85" rx="15" style="fill:var(--ill-f-y)" stroke="none"/><rect x="0" y="236" width="120" height="85" rx="15"/></g><g style="stroke:var(--ill-s-g)"><rect x="147" y="248" width="120" height="85" rx="15" style="fill:var(--ill-f-g)" stroke="none"/><rect x="134" y="236" width="120" height="85" rx="15"/></g><g style="stroke:var(--ill-s-p)"><rect x="280" y="248" width="120" height="85" rx="15" style="fill:var(--ill-f-p)" stroke="none"/><rect x="267" y="236" width="120" height="85" rx="15"/></g></g></svg>';

   el título y el HTML de "body". Cada simulador se declara en "widgets"
   con el nombre de una función de WIDGETS (widgets.js).
   ============================================================ */

/* ───────────── UNIDAD 4 ───────────── */
{
  n: 1, unit: 4, title: 'La luz y el espectro visible',
  lede: 'Qué es la luz, qué parte vemos y por qué en un espectáculo la luz es mucho más que ver.',
  body: `
<h2>Qué es la luz</h2>
<p>La luz es una forma de <strong>radiación electromagnética</strong> que el ojo humano puede percibir. Se comporta como una onda y se propaga en línea recta hasta interactuar con una superficie.</p>
<p>Al interactuar con la materia presenta fenómenos de <strong>reflexión, refracción, difracción, absorción y dispersión</strong>. Los dos primeros son la base de la óptica de los proyectores (lección 4).</p>
<h2>El espectro visible</h2>
<p>La luz viaja a 300.000 km/s y es solo una porción del espectro electromagnético: la que va <strong>de 380 a 780 nm</strong> de longitud de onda. Cada longitud de onda se interpreta como un color distinto.</p>
<h2>La luz en un espectáculo</h2>
<p>En luminotecnia la luz es la energía visible que permite ver y crear ambientes. No solo ilumina: comunica sensación, volumen, distancia, ritmo y ambiente, y controla el estado emocional del público.</p>
<div class="callout"><p>Para describir y diseñar la luz se trabaja con cuatro ideas: <strong>intensidad, tipo (calidad), dirección y color</strong>. Las siguientes lecciones recorren cada una.</p></div>`,
  widgets: [{ key: 'espectro', title: 'Recorre el espectro', note: 'Mueve la longitud de onda y mira qué color percibe el ojo. Fuera de 380–780 nm no vemos nada.' }],
  quiz: [
    { q: '¿Qué rango de longitudes de onda detecta el ojo humano?', o: ['100 – 400 nm', '380 – 780 nm', '780 – 1500 nm', '200 – 700 nm'], a: 1, why: 'El espectro visible va de 380 a 780 nm.' },
    { q: '¿A qué velocidad se propaga la luz?', o: ['3.000 km/s', '30.000 km/s', '300.000 km/s', '3.000.000 km/s'], a: 2, why: 'Unos 300.000 km/s.' },
    { q: '¿Cuál de estos NO es un fenómeno de la luz?', o: ['Refracción', 'Difracción', 'Condensación', 'Dispersión'], a: 2, why: 'Los fenómenos son reflexión, refracción, difracción, absorción y dispersión.' }
  ]
},
{
  n: 2, unit: 4, title: 'Intensidad y magnitudes: lumen, candela y lux',
  lede: 'Cuánta luz emite un foco, cuánta llega a una superficie y por qué se reparte tan rápido con la distancia.',
  body: `
<h2>Intensidad</h2>
<p>Es la cantidad de luz necesaria para obtener el efecto que deseamos, o la cantidad real de energía lumínica emitida o recibida. Se controla con:</p>
<ul><li>la <strong>potencia propia</strong> del foco,</li><li>los <strong>filtros de color</strong>,</li><li>la <strong>dimmerización</strong> de la intensidad.</li></ul>
<h3>Factores que la afectan</h3>
<ul>
<li><strong>Distancia:</strong> si duplicas la distancia, recibes ¼ de luz.</li>
<li><strong>Tipo de óptica:</strong> una apertura amplia da menos intensidad en un punto y más dispersión.</li>
<li><strong>Colores aplicados:</strong> ciertos filtros reducen la intensidad.</li>
</ul>
<h2>Magnitudes y unidades</h2>
${tbl(['Magnitud', 'Símbolo', 'Qué mide', 'Unidad'], [
  ['Lumen', 'lm', 'Flujo luminoso: cantidad total de luz que emite una fuente (potencia)', 'lm'],
  ['Candela', 'cd', 'Intensidad luminosa en una dirección concreta (flujo por unidad de ángulo sólido)', 'cd'],
  ['Lux', 'lx', 'Iluminancia: luz que recibe una superficie (lm/m²)', 'lx'],
  ['% Dimmer', '%', 'Control escénico de salida entre 0 % y 100 %', '—']
])}
<span class="formula">E (lux) = I (cd) / d² (m²)</span>
<p>Esta relación explica la regla de la distancia: al pasar de <em>d</em> a <em>2d</em>, el denominador se multiplica por 4 y la iluminancia cae a la cuarta parte.</p>`,
  widgets: [{ key: 'fotometria', title: 'Del lumen al lux', note: 'Cambia el flujo, el ángulo del haz y la distancia. Se supone que todo el flujo va dentro del cono del haz.' }],
  after: exercise('4.1', `<p>Si un foco emite 10.000 lúmenes y está a 2 metros de una superficie, ¿cuántos lux recibe esa superficie? ¿Qué ocurre si duplicas la distancia?</p><p class="note" style="margin-top:8px">Pista: para pasar de lúmenes a lux hace falta saber sobre qué área se reparte la luz, es decir, el ángulo del haz. Pruébalo en el simulador.</p>`),
  quiz: [
    { q: 'Si duplicas la distancia entre el foco y la superficie, ¿cuánta luz recibe la superficie?', o: ['La mitad', 'Una cuarta parte', 'El doble', 'Lo mismo'], a: 1, why: 'La iluminancia es inversamente proporcional al cuadrado de la distancia.' },
    { q: '¿Qué magnitud mide la luz que recibe una superficie?', o: ['Lumen', 'Candela', 'Lux', 'Dimmer'], a: 2, why: 'El lux es lumen por metro cuadrado.' },
    { q: 'La candela mide…', o: ['El flujo total de la fuente', 'La intensidad en una dirección concreta', 'La temperatura de color', 'El nivel de dimmer'], a: 1, why: 'Es el flujo luminoso por unidad de ángulo sólido.' },
    { q: 'Una óptica de apertura amplia produce…', o: ['Más intensidad en un punto', 'Menos intensidad en un punto y más dispersión', 'Siempre luz dura', 'Mayor temperatura de color'], a: 1, why: 'La luz se reparte en más superficie.' }
  ]
},
{
  n: 3, unit: 4, title: 'Calidad y dirección de la luz',
  lede: 'Luz dura o suave, y desde dónde llega: lo que más cambia el aspecto de lo que iluminas.',
  body: `
<h2>Calidad (tipo) de luz</h2>
<p>Describe cómo se comporta el haz y determina el carácter visual de la escena.</p>
<h3>Luz dura</h3>
<p>Proviene de una fuente pequeña o concentrada. Produce sombras nítidas y contrastes fuertes. Se obtiene con PAR, recortes (profiles) y móviles tipo Beam.</p>
<h3>Luz suave</h3>
<p>Proviene de una fuente grande o difusa. Da sombras más blandas, bordes suaves y un ambiente envolvente. Se obtiene con Fresnel, PC con lente difusa y móviles tipo Wash.</p>
<h2>Dirección</h2>
<p>Según el ángulo en que incide, la luz permite expresar e iluminar de formas distintas: controla desde dónde llega y cómo modela los volúmenes.</p>
${tbl(['Dirección', 'Desde dónde llega'], [
  ['Frontal', 'Desde el frente, hacia el sujeto'],
  ['Contraluz', 'Desde detrás del sujeto'],
  ['Lateral', 'Desde un lado'],
  ['Cenital', 'Desde arriba'],
  ['Nadir', 'Desde abajo']
])}`,
  widgets: [{ key: 'modelado', title: 'Modela un volumen', note: 'Elige la dirección y la dureza de la luz y observa la sombra proyectada.' }],
  quiz: [
    { q: 'Una fuente pequeña o concentrada produce…', o: ['Luz suave', 'Luz dura', 'Luz difusa', 'Contraluz'], a: 1, why: 'Sombras nítidas y contrastes fuertes.' },
    { q: '¿Cuál de estos proyectores da una luz suave?', o: ['PAR', 'Recorte', 'Fresnel', 'Beam'], a: 2, why: 'El Fresnel genera un haz suave de bordes difusos.' },
    { q: 'La luz que llega desde arriba se llama…', o: ['Nadir', 'Cenital', 'Lateral', 'Frontal'], a: 1, why: 'Cenital = arriba; nadir = abajo.' },
    { q: 'La luz que llega desde abajo se llama…', o: ['Nadir', 'Cenital', 'Contraluz', 'Lateral'], a: 0, why: 'Nadir es desde abajo.' }
  ]
},
{
  n: 4, unit: 4, title: 'Reflexión y refracción',
  lede: 'Los dos fenómenos que explican espejos, lentes, prismas y la óptica de cualquier proyector.',
  body: `
<h2>Reflexión</h2>
<p>La luz rebota sobre una superficie y cambia de dirección sin alterar su velocidad.</p>
<ul>
<li><strong>Especular</strong> (como en un espejo): la luz rebota de manera ordenada y el ángulo de incidencia es igual al ángulo de reflexión.</li>
<li><strong>Difusa:</strong> la luz se dispersa en múltiples direcciones y no se mantiene una dirección clara.</li>
</ul>
<h2>Refracción</h2>
<p>Es el cambio de dirección y de velocidad que sufre la luz al pasar de un medio a otro (aire → vidrio, aire → agua).</p>
<p>La óptica de los proyectores se basa en este principio:</p>
<ul>
<li><strong>Lentes:</strong> cambian la forma del haz (abren, cierran, concentran).</li>
<li><strong>Prismas:</strong> dividen o multiplican el haz.</li>
<li><strong>Focos/zooms:</strong> permiten ajustar la nitidez con precisión.</li>
</ul>
<h3>Refracción positiva y negativa</h3>
<ul>
<li>Las lentes <strong>convexas</strong> concentran la luz (spot).</li>
<li>Las lentes <strong>cóncavas</strong> la dispersan (wash).</li>
</ul>`,
  widgets: [
    { key: 'refraccion', title: 'Reflejo y refracción en una superficie', note: 'Cambia el ángulo de incidencia y el medio. El rayo azul se refracta, el ámbar se refleja.' },
    { key: 'lentes', title: 'Lentes convexas y cóncavas', note: 'Cinco rayos paralelos atraviesan la lente.' }
  ],
  quiz: [
    { q: 'En un espejo, la reflexión es…', o: ['Difusa', 'Especular', 'Una refracción', 'Una absorción'], a: 1, why: 'La luz rebota ordenadamente.' },
    { q: 'Una lente convexa…', o: ['Concentra la luz (spot)', 'Dispersa la luz (wash)', 'Multiplica el haz', 'No altera el haz'], a: 0, why: 'Las convexas concentran, las cóncavas dispersan.' },
    { q: '¿Qué elemento óptico divide o multiplica el haz?', o: ['Lente convexa', 'Gel', 'Prisma', 'Iris'], a: 2, why: 'Los prismas dividen o multiplican el haz.' },
    { q: 'En la reflexión especular, el ángulo de incidencia es…', o: ['Mayor que el de reflexión', 'Menor que el de reflexión', 'Igual al de reflexión', 'Independiente del de reflexión'], a: 2, why: 'Ángulo de incidencia = ángulo de reflexión.' }
  ]
},
{
  n: 5, unit: 4, title: 'Temperatura de color',
  lede: 'Por qué una bombilla se ve amarilla y el cielo azul, y cómo se mide.',
  body: `
<h2>Qué es</h2>
<p>La temperatura de color indica la dominancia de alguno de los colores del espectro sobre los demás. Mide la dominante cromática de una fuente de luz: <strong>cálida</strong> (amarilla o rojiza) o <strong>fría</strong> (azulada). Se mide en <strong>grados Kelvin (K)</strong>.</p>
${tbl(['Temperatura', 'Apariencia'], [
  ['2000 – 3000 K', 'Cálida (amarilla)'],
  ['4000 – 5000 K', 'Neutra'],
  ['5600 K', '«Día» estándar'],
  ['6500 – 9000 K', 'Azulada']
])}
<div class="callout cool"><p>Cuanto <strong>más baja</strong> es la temperatura, <strong>más cálida</strong> es la luz. Es lo contrario de lo que sugiere la palabra «temperatura».</p></div>`,
  widgets: [{ key: 'temperatura', title: 'Desliza los Kelvin', note: 'Color aproximado de una fuente blanca a cada temperatura de color.' }],
  quiz: [
    { q: '¿En qué unidad se mide la temperatura de color?', o: ['Lux', 'Kelvin', 'Lumen', 'Nanómetro'], a: 1, why: 'Grados Kelvin (K).' },
    { q: '¿Qué valor corresponde a la luz de «día» estándar?', o: ['3200 K', '4500 K', '5600 K', '9000 K'], a: 2, why: '5600 K.' },
    { q: 'Una luz de 2500 K se ve…', o: ['Azulada', 'Neutra', 'Cálida (amarilla)', 'Verde'], a: 2, why: 'De 2000 a 3000 K es cálida.' }
  ]
},
{
  n: 6, unit: 4, title: 'Fuentes de luz',
  lede: 'De la incandescente al LED: qué rendimiento, calor, color y vida útil ofrece cada tecnología.',
  body: `
<h2>Incandescente</h2>
<p>Un filamento (generalmente de wolframio) se calienta hasta ponerse incandescente. Luz cálida entre 2700 K y 3200 K, encendido instantáneo, filamento que se deteriora y mucha energía perdida en calor. Prácticamente en desuso en luminotecnia.</p>
<h2>Dicroica</h2>
<p>Proyector halógeno con un filtro dicroico en el reflector que separa calor y luz: luz frontal muy limpia, mucho menos calor hacia delante (se disipa por detrás), colores y temperatura más controlados y alto consumo.</p>
<h2>Fluorescente</h2>
<p>Tubo lleno de gases y fósforos que emiten luz cuando los electrones colisionan. Muy eficiente, muy poco calor, y encendido lento con parpadeo inicial en los modelos antiguos.</p>
<h2>Descarga (HMI)</h2>
<p>Cápsula de cuarzo llena de gas con dos electrodos que producen descargas periódicas. Lámparas muy potentes de temperatura de color fría (5500 – 6000 K).</p>
<h2>Halógena</h2>
<p>Evolución de la incandescente: filamento y gas halógeno, que mantiene el filamento más tiempo. Mejor rendimiento, temperatura estable de 3200 K, mucho calor y vida útil algo mayor pero limitada. En luminotecnia convencional se usa en PAR 64, Fresnel, PC y recortes.</p>
<h2>LED</h2>
<p>Un diodo emisor de luz: al pasar corriente, un semiconductor libera fotones. Es muy eficiente, casi no calienta en el haz (sí en el cuerpo si no se refrigera bien), dura entre 25.000 y 50.000 h, tiene temperatura de color configurable, encendido instantáneo y permite mezcla RGB, RGBW, RGBA, RGB-Lime, etc.</p>
<div class="callout"><p>El LED es el estándar absoluto en luminotecnia moderna.</p></div>
<h2>Comparativa</h2>
${tbl(['Fuente', 'Rendimiento', 'Temp. color', 'Calor', 'Vida útil', 'Desventajas'], [
  ['Incandescente', 'Muy bajo (10–15 lm/W)', '2700–3000 K', 'Muy alto', '750–2.000 h', 'Mucho consumo y calor, obsoleta'],
  ['Halógena', 'Bajo (15–25 lm/W)', '3000–3200 K', 'Muy alto', '2.000–4.000 h', 'Mucho calor, poco eficiente'],
  ['Dicroica', 'Medio (20–30 lm/W)', '3000–3200 K', 'Medio (calor atrás)', '3.000–5.000 h', 'Consumo alto respecto al LED'],
  ['Fluorescente', 'Alto (60–100 lm/W)', '3000–6500 K', 'Bajo', '7.000–15.000 h', 'Parpadeo, CRI variable, sin efectos'],
  ['Descarga', 'Muy alto (80–120+ lm/W)', '5600–8000 K', 'Muy alto', '750–3.000 h', 'No regulable, cambio costoso'],
  ['LED', 'Muy alto (80–150+ lm/W)', '2700–9000 K / RGBW', 'Bajo', '25.000–50.000 h', 'Requiere buena refrigeración']
])}`,
  widgets: [{ key: 'fuentes', title: 'Cuánto consume cada fuente', note: 'Vatios necesarios para un mismo flujo luminoso, con el punto medio de cada rango de la tabla.' }],
  after: exercise('4.3', `<p>Selección de fuente según el contexto. Para cada situación, elige la fuente de luz más adecuada (halógena, LED, descarga, fluorescente) y justifica tu elección:</p>
<ol type="a"><li>Obra de teatro con regulación suave y cambios lentos de intensidad.</li><li>Festival al aire libre con muchas horas de funcionamiento continuo.</li><li>Rodaje o espectáculo que debe simular luz de día realista.</li><li>Evento en un espacio pequeño con limitación de consumo eléctrico.</li></ol>`),

  body: `
<h2>PAR</h2>
<p>Parabolic Aluminized Reflector. Lámpara sellada (en modelos halógenos) con reflector parabólico y óptica según modelo: Narrow, Medium, Wide. Permite montar filtros. Consigue un haz casi paralelo, muy concentrado y brillante, pero <strong>no permite control del ángulo ni del haz</strong>.</p>
<p>Su numeración indica el diámetro en octavos de pulgada: PAR 64 (200 mm), PAR 56 (175 mm) y PAR 36 (115 mm).</p>
${tbl(['Lámpara', 'Código', 'Acabado', 'Ángulo'], [
  ['Tipo 1', 'CP60', 'Liso', 'Cerrado'],
  ['Tipo 2', 'CP61', 'Rugoso', 'Intermedio'],
  ['Tipo 5', 'CP62', 'Rallado', 'Abierto en un eje']
])}
<h2>PAR LED</h2>
<p>Usa diodos LED en lugar de lámparas halógenas, con grupos RGBW, RGBA o RGB-Lime. Mantiene el haz amplio y potente del PAR, con menor consumo, poca emisión de calor y cambio de color sin filtros.</p>
<h2>PC (plano convexo)</h2>
<p>Usa una lente plano-convexa para concentrar y dirigir la luz. Se regula la distancia entre lámpara y lente para abrir o cerrar el haz. Admite viseras para recortar el haz y evitar derrames. Su haz es más definido que el de un Fresnel y su enfoque es preciso.</p>
<h2>Fresnel</h2>
<p>Lente con anillos concéntricos que reducen peso y grosor. A diferencia del PC, la luz es difusa: se usa para rellenar y evitar que se vea una luz definida en escena. Tiene zoom (la lámpara se desplaza hacia delante o atrás).</p>
<h2>Recortes (profile)</h2>
<p>Haz muy definido y controlable, para iluminar áreas concretas. Tienen cuchillas internas para recortar el haz, porta-gobos para proyectar patrones o imágenes, y zoom y enfoque para variar tamaño y nitidez.</p>
<h2>Cegadoras y pixel bars</h2>
<p>La <strong>cegadora</strong> es un proyector de gran intensidad que emite luz frontal directa, normalmente hacia el público, para iluminarlo y provocar golpes de efecto.</p>
<p>La <strong>pixel bar</strong> es un proyector LED lineal formado por segmentos (píxeles) controlables de forma independiente. Su función principal es cubrir fondos, telones o cicloramas.</p>

  lede: 'Dimmer, pan, tilt, color, zoom, iris, enfoque, frost, prisma y gobo: qué controla cada canal.',
  body: `
<p>Una cabeza móvil se maneja con <strong>canales de control</strong>: cada uno regula un atributo y recibe un valor DMX de 0 a 255 (lección 14).</p>
<h2>Los atributos</h2>
<h3>Dimmer</h3>
<p>Regula la intensidad de 0 % a 100 %. En halógenas, al bajar la intensidad la luz se vuelve más cálida; en LED el color se mantiene estable gracias al control electrónico.</p>
<h3>Pan y tilt</h3>
<p>Motores paso a paso controlados por DMX. <strong>Pan</strong> es la rotación horizontal (unos 540°) y <strong>tilt</strong> la vertical (unos 270°). La velocidad es ajustable.</p>
<h3>Color</h3>
<p>Mediante una <strong>rueda de color</strong> (discos con filtros dicroicos) o por mezcla <strong>RGB</strong>. Los <strong>filtros</strong> (geles) son láminas de plástico resistente al calor delante del foco para cambiar el color, corregir la temperatura de color, reducir intensidad sin cambiar el color y crear atmósferas.</p>
<h3>Zoom, iris, enfoque y frost</h3>
<ul>
<li><strong>Zoom:</strong> sistema óptico motorizado que ajusta la distancia entre lentes. Rango típico 5° a 50°.</li>
<li><strong>Iris:</strong> diafragma mecánico con láminas que reduce el diámetro del haz sin perder foco.</li>
<li><strong>Enfoque (focus):</strong> ajuste motorizado de la distancia focal para la nitidez. Es clave para gobos y recortes.</li>
<li><strong>Frost:</strong> desenfoque muy grande. Convierte un spot en wash, difumina el rayo y aumenta la cobertura.</li>
</ul>
<h3>Prisma y gobo</h3>
<ul>
<li><strong>Prisma:</strong> elemento óptico giratorio que divide el haz en varios (circulares o lineales: 2, 3, 5 o más copias).</li>
<li><strong>Gobo:</strong> disco metálico o de vidrio con patrones. Pueden ser estáticos, rotativos o indexables. Sirven para proyectar logos, texturas dinámicas y efectos arquitectónicos.</li>
</ul>
<h3>Máquina de humo (hazer / fog)</h3>
<p>Hace visible el haz en el aire. Sin humo, un beam apenas se aprecia.</p>
<h2>Resumen</h2>

  body: `
<div class="callout"><p><strong>Todo lo que se cuelga, puede caer.</strong> El rigging es todo lo que sostiene cosas en el aire de forma segura.</p></div>
<h2>Elementos</h2>
<h3>Trusses</h3>
<p>Estructuras modulares de aluminio que forman marcos rígidos y ligeros donde colgar iluminación, sonido, pantallas, etc. Pueden ser cuadrados, triangulares o planos. Para un montaje seguro hay que usar trusses certificados y diseñados para <strong>cargas estáticas</strong> (no dinámicas).</p>
<h3>Torres</h3>
<p>Estructuras telescópicas para elevar trusses, luminarias o pequeños arrays de altavoces. Hay dos tipos:</p>
<ul>
<li><strong>Top-loading</strong> (carga superior): sustentan la carga en el cabezal mediante un cabrestante, para elevaciones moderadas con el centro de gravedad contenido verticalmente.</li>
<li><strong>Front-loading</strong> (carga frontal): elevan la carga muy cerca del suelo con horquillas delanteras reforzadas. Idóneas para cargas pesadas o con voladizo (por ejemplo, line arrays).</li>
</ul>
<h3>Garras</h3>
<p>Herrajes de sujeción para fijar los aparatos a tubos o trusses. Suelen ser de aleación de aluminio o acero, con forma de «C» ajustable al diámetro del tubo y un tornillo de presión. <strong>Cada abrazadera tiene un límite de carga.</strong></p>
<h3>Cables de seguridad (safety)</h3>
<p>Tras fijar cada luz con su garra es imprescindible añadir un cable de seguridad: cable de acero inoxidable con mosquetón, como sistema de reserva si falla la abrazadera principal. En cada pieza suspendida se debe instalar <strong>al menos uno</strong>, fijado al truss o a la torre.</p>
<h3>Elevadores (Genie)</h3>
<p>Plataformas elevadoras móviles de personal que permiten trabajos en altura. En espectáculos se usan en el montaje, ajuste y desmontaje de iluminación, sonido y estructuras.</p>
<h3>Motores y polipastos</h3>
<p>Dispositivos mecánicos para subir, bajar o suspender cargas pesadas de forma controlada, con un sistema de poleas, engranajes y cable o cadena. Pueden ser manuales de cadena, manuales de palanca o eléctricos de cadena.</p>
<h2>Rigging</h2>
<p>Es el conjunto de técnicas, elementos y procedimientos para suspender, elevar, fijar y asegurar equipos técnicos. Se apoya en tres principios:</p>
<ol><li>Sujeción correcta.</li><li>Cálculo de cargas.</li><li>Sistemas de seguridad redundantes.</li></ol>
<p>Según el montaje se habla de <strong>rigging en suelo</strong> (ground support: la estructura se apoya en el suelo) y <strong>rigging suspendido</strong> (la estructura cuelga del techo). En teatros y recintos cubiertos se usa también el <strong>peine</strong>.</p>`,

  lede: 'De dónde sale la energía de un espectáculo y cómo se reparte con seguridad.',
  body: `
<h2>Acometida</h2>
<p>Es el punto de entrada de la energía al recinto. Normalmente parte del cuadro eléctrico principal y alimenta los tableros de distribución. En eventos profesionales se suele pedir <strong>acometida trifásica</strong>: tres fases de unos 230 V cada una (380–400 V entre fases), que permite transportar más potencia con mayor eficiencia.</p>
<h2>Corriente trifásica</h2>
<p>Usa tres conductores activos (fases) más neutro y tierra. Permite alimentar grandes potencias de forma equilibrada y con corrientes inferiores en cada cable, por eso es el estándar profesional. La <strong>monofásica</strong> lleva una sola fase (230 V) y neutro, como en las viviendas.</p>
<p>Lo habitual es que la acometida general sea trifásica y luego se distribuyan circuitos monofásicos a los equipos (dimmers y racks de sonido, por ejemplo). Hay que conocer si el lugar tiene acometida de 220 V (monofásica) o de 380 V (trifásica) y adaptar el cableado.</p>
<h2>Grupo electrógeno</h2>
<p>Proporciona energía cuando no hay red o como respaldo. En espectáculos se emplean generadores silenciosos (cabina insonorizada) con regulación estable de voltaje y frecuencia. Deben ubicarse <strong>lejos del público</strong> (por el ruido), ventilados y conectados al tablero de distribución de forma segura, y soportar cambios repentinos de carga.</p>
<h2>Distribuidores de corriente</h2>
<p>Paneles portátiles que reciben la acometida o el generador y reparten la energía en varias salidas protegidas. Permiten dividir la potencia en circuitos protegidos y facilitan la gestión eléctrica del espectáculo.</p>

<h2>Conexionado en cascada</h2>

<h2>Splitters y nodos</h2>
<p>El <strong>splitter</strong> recibe una señal y la divide en varias salidas independientes sin perder integridad. Sirve para repartir una línea a varias zonas, evitar cadenas demasiado largas, aislar fallos (si una línea falla, las demás siguen) y proteger la consola frente a retornos eléctricos.</p>
<p>El <strong>nodo</strong> convierte señales de red (Ethernet) en DMX512 y viceversa. Sirve para distribuir muchos universos por red, reducir tiradas largas de cable DMX, integrar la iluminación en redes IP y controlar grandes montajes.</p>

const nf = (n, d = 0) => Number(n).toLocaleString('es-ES', { maximumFractionDigits: d, minimumFractionDigits: 0 });
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rad = d => d * Math.PI / 180;

const rng = (id, label, min, max, step, val) =>
  `<label class="ctl"><span class="ctl-l">${label}</span><output class="ctl-o" id="${id}-o"></output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;

/* Enlaza sliders con su salida de texto. fmt: {id: v => texto}. Llama a cb en cada cambio. */
function bindRanges(el, fmt, cb) {
  const upd = () => {
    el.querySelectorAll('input[type=range]').forEach(r => {
      const o = el.querySelector('#' + r.id + '-o');
      if (o) o.textContent = (fmt[r.id] ? fmt[r.id](+r.value) : r.value);
    });
    cb();
  };
  el.querySelectorAll('input[type=range]').forEach(r => r.addEventListener('input', upd));
  upd();
  return upd;
}

/* Botones exclusivos. */
function bindOpts(el, sel, cb) {
  const btns = [...el.querySelectorAll(sel)];
  btns.forEach(b => b.addEventListener('click', () => {
    btns.forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    cb(b.dataset.v, b);
  }));
}

function setupCanvas(cv, w, h) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

function wl2rgb(w) {
  let r = 0, g = 0, b = 0;
  if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
  else if (w < 490) { g = (w - 440) / 50; b = 1; }
  else if (w < 510) { g = 1; b = -(w - 510) / 20; }
  else if (w < 580) { r = (w - 510) / 70; g = 1; }
  else if (w < 645) { r = 1; g = -(w - 645) / 65; }
  else if (w <= 780) { r = 1; }
  let f = 0;
  if (w >= 380 && w <= 780) f = w < 420 ? .3 + .7 * (w - 380) / 40 : w > 700 ? .3 + .7 * (780 - w) / 80 : 1;
  const c = v => Math.round(255 * Math.pow(v * f, .8));
  return [c(r), c(g), c(b)];
}

function kelvinRGB(K) {
  const t = K / 100, c = v => Math.round(clamp(v, 0, 255));
  const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  const b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  return [c(r), c(g), c(b)];
}

const WIDGETS = {};

  for (let w = 380; w <= 780; w += 10) { const [r, g, b] = wl2rgb(w); stops.push(`rgb(${r},${g},${b}) ${((w - 300) / 6).toFixed(2)}%`); }
  const grad = `linear-gradient(90deg,#262a36 0%,#262a36 13.33%,${stops.join(',')},#3a2828 80%,#3a2828 100%)`;
  el.innerHTML = `

  const q = s => el.querySelector(s);

/* ============================================================
   MOTOR 3D · escenario, focos con luz real y haces volumétricos
   Requiere THREE (r158). Si no hay WebGL se usan los simuladores 2D.
   Unidades: metros. Suelo en y = 0, fondo en z = -6, público hacia +z.
   ============================================================ */
const HAS_GL = (() => {
  try {
    if (!window.THREE) return false;
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch (e) { return false; }
})();

/* ── Mapas de forma para la luz (gobos, iris, óptica del PAR, cuchilla) ── */
const _mapCache = new Map();
function shapeMap(kind = 'open', o = {}) {
  const r = o.r ?? 1, blur = o.blur ?? 0, cut = o.cut ?? 0;
  if (kind === 'open' && r >= .999 && blur === 0 && cut === 0) return null;
  const key = [kind, r.toFixed(2), Math.round(blur), cut.toFixed(2)].join('|');
  if (_mapCache.has(key)) return _mapCache.get(key);
  if (_mapCache.size > 48) { _mapCache.forEach(t => t.dispose()); _mapCache.clear(); }
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
  g.translate(S / 2, S / 2);
  const R = S / 2 * .98 * r;
  g.fillStyle = '#fff'; g.shadowColor = '#fff'; g.shadowBlur = blur;
  const disc = (x, y, rad) => { g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill(); };
  if (kind === 'open') disc(0, 0, R);
  else if (kind === 'oval') { g.beginPath(); g.ellipse(0, 0, R, R * .68, 0, 0, 7); g.fill(); }
  else if (kind === 'puntos') [[0, 0], [1, 0], [-1, 0], [.5, .87], [-.5, .87], [.5, -.87], [-.5, -.87]].forEach(([x, y]) => disc(x * R * .5, y * R * .5, R * .15));
  else if (kind === 'estrella') { g.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? R * .4 : R * .94, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill(); }
  else if (kind === 'lineas') [-.66, -.33, 0, .33, .66].forEach(x => { g.beginPath(); g.rect(x * R - R * .07, -R, R * .14, 2 * R); g.fill(); });
  else if (kind === 'prisma') [[0, -.5], [-.5, .32], [.5, .32]].forEach(([x, y]) => disc(x * R, y * R, R * .36));
  if (cut > 0) { g.shadowBlur = 0; g.fillStyle = '#000'; g.fillRect(S / 2 - cut * S, -S / 2, cut * S, S); }
  const t = new THREE.CanvasTexture(c);
  _mapCache.set(key, t);
  return t;
}

/* ── Haz volumétrico ── */
const BEAM_L = 24;
let _beamGeo = null;
function beamGeometry() {
  if (_beamGeo) return _beamGeo;
  const g = new THREE.CylinderGeometry(0.01, BEAM_L, BEAM_L, 40, 1, true); // radio base = L → tan 45°
  g.translate(0, -BEAM_L / 2, 0); g.rotateX(Math.PI / 2);                // apunta a -z, vértice en el origen
  return (_beamGeo = g);
}
function beamMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide,
    uniforms: { uColor: { value: new THREE.Color(1, 1, 1) }, uOpacity: { value: .2 }, uEdge: { value: 1.6 }, uL: { value: BEAM_L } },
    vertexShader: `varying vec3 vN; varying vec3 vV; varying float vT; uniform float uL;
      void main(){ vT = -position.z / uL; vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position,1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying vec3 vN; varying vec3 vV; varying float vT; uniform vec3 uColor; uniform float uOpacity; uniform float uEdge;
      void main(){ float f = abs(dot(normalize(vN), normalize(vV))); float edge = pow(f, uEdge);
        float along = pow(max(0.0, 1.0 - vT), 1.4) * smoothstep(0.0, 0.03, vT);
        gl_FragColor = vec4(uColor, uOpacity * edge * along); }`

}

/* ── Panel de controles ── */
function buildControls(host, specs, ui) {
  host.innerHTML = '';
  const els = {}; let reads = null;
  specs.forEach(s => {
    if (s.t !== 'read') reads = null;
    if (s.t === 'range') {
      const w = document.createElement('div'); host.appendChild(w);
      w.innerHTML = `<label class="ctl"><span class="ctl-l">${s.label}</span><output class="ctl-o"></output><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.v}"></label>`;
      const inp = w.querySelector('input'), out = w.querySelector('output');
      const upd = () => { out.textContent = s.fmt ? s.fmt(+inp.value) : inp.value; };
      inp.addEventListener('input', () => { upd(); s.on && s.on(+inp.value); });
      upd(); els[s.id] = { inp, upd, w };
    } else if (s.t === 'chips') {
      const w = document.createElement('div'); host.appendChild(w);
      w.innerHTML = `${s.label ? `<span class="ctl-l" style="font-size:.88rem">${s.label}</span>` : ''}<div class="btns">${s.opts.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="${o[0] === s.v}">${o[1]}</button>`).join('')}</div>`;
      const btns = [...w.querySelectorAll('.opt')];
      btns.forEach((b, i) => b.addEventListener('click', () => { btns.forEach(x => x.setAttribute('aria-pressed', x === b)); s.on && s.on(s.opts[i][0]); }));
      els[s.id] = { btns, opts: s.opts, w };
    } else if (s.t === 'toggle') {
      const w = document.createElement('div'); host.appendChild(w);
      w.innerHTML = `<button class="opt" aria-pressed="${!!s.v}">${s.label}</button>`;
      const b = w.querySelector('button');
      b.addEventListener('click', () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); s.on && s.on(v); });
      els[s.id] = { b, w };
    } else if (s.t === 'btn') {
      const w = document.createElement('div'); host.appendChild(w);
      w.innerHTML = `<button class="btn small${s.primary ? ' primary' : ''}">${s.label}</button>`;
      w.querySelector('button').addEventListener('click', () => s.on && s.on());
    } else if (s.t === 'read') {
      if (!reads) { reads = document.createElement('div'); reads.className = 'reads'; host.appendChild(reads); }
      const r = document.createElement('div'); r.className = 'read' + (s.hot ? ' hot' : '') + (s.txt ? ' txt' : ''); r.innerHTML = `<b>—</b><span>${s.label}</span>`; reads.appendChild(r);
      els[s.id] = { b: r.querySelector('b') };
    } else if (s.t === 'html') {
      const w = document.createElement('div'); host.appendChild(w); w.innerHTML = s.html || ''; els[s.id] = { w };
    } else if (s.t === 'note') {
      const w = document.createElement('p'); w.className = 'note'; w.textContent = s.text; host.appendChild(w);
    }
  });
  host.style.display = 'grid'; host.style.gap = '12px';
  ui.read = (id, txt) => { if (els[id] && els[id].b && els[id].b.tagName === 'B') els[id].b.textContent = txt; };
  ui.html = (id, h) => { if (els[id]) els[id].w.innerHTML = h; };
  ui.el = id => els[id] && els[id].w;
  ui.set = (id, v) => {
    const e = els[id]; if (!e) return;
    if (e.inp) { e.inp.value = v; e.upd(); }
    else if (e.btns) e.btns.forEach((b, i) => b.setAttribute('aria-pressed', e.opts[i][0] === v));
    else if (e.b && e.b.tagName === 'BUTTON') e.b.setAttribute('aria-pressed', !!v);
  };
  ui.show = (id, on) => { if (els[id] && els[id].w) els[id].w.style.display = on ? '' : 'none'; };
}

      const k = (Math.sin(t * .25 + i * 1.7) + 1) / 2, c = cols[(i + Math.floor(t / 4)) % 4], d = cols[(i + Math.floor(t / 4) + 1) % 4];
      f.rgb = [c[0] + (d[0] - c[0]) * k, c[1] + (d[1] - c[1]) * k, c[2] + (d[2] - c[2]) * k]; f.apply();
    });
    const v = st.goal; v.theta = Math.sin(t * .08) * .5;
  });
  return { controls: [] };
};

  let failing = false;
  const place = (r) => {
    const top = new THREE.Vector3(r.x + .12, 6 - .12, -1), bot = new THREE.Vector3(r.x + .08, r.y + .27, -1), mid = top.clone().add(bot).multiplyScalar(.5);
    r.cable.position.copy(mid); r.cable.scale.y = Math.max(.05, top.distanceTo(bot)); r.ring.position.copy(top); r.cable.visible = r.ring.visible = r.safe;
  };
  const text = () => {
    const n = R.filter(r => r.safe).length, fallen = failing ? R.filter(r => !r.safe).length : 0;
    ui.read('n', `${n} de ${R.length}`);
    ui.hud(failing ? `<b>${fallen ? fallen + (fallen === 1 ? ' foco caído' : ' focos caídos') : 'Todo quedó colgado'}</b><span>${R.length - fallen} con su cable de seguridad</span>` : `<b>${n} de ${R.length} con safety</b><span>haz clic en un foco para asegurarlo</span>`);
  };
  st.onPick = (fx) => { if (!fx || failing) return; const r = R.find(q => q.fx === fx); if (r) { r.safe = !r.safe; place(r); text(); } };
  st.onFrame((dt, t) => {
    R.forEach((r, i) => {
      if (failing) {
        r.vy -= 9.8 * dt; r.y += r.vy * dt;
        if (r.safe) { if (r.y < Y0 - CL) { r.y = Y0 - CL; r.vy = -r.vy * .25; } r.rz = Math.sin(t * 6 + i) * .12 * Math.exp(-(t % 1000) * 0) * Math.min(1, (Y0 - r.y) / CL); }
        else { if (r.y < .2) { r.y = .2; r.vy = 0; } else { r.rot += dt * (1.5 + i * .4); } }
      }
      r.fx.group.position.y = r.y; r.fx.group.rotation.z = r.safe ? r.rz : 0; r.fx.group.rotation.x = r.safe ? 0 : r.rot * .5;
      place(r);
    });
  });
  const reset = () => { failing = false; R.forEach(r => { r.y = Y0; r.vy = 0; r.rot = 0; r.rz = 0; }); text(); };
  return {
    refresh: text, controls: [
      { t: 'read', id: 'n', label: 'Focos con safety', hot: true },
      { t: 'btn', id: 'fail', label: 'Soltar las garras', primary: true, on: () => { if (!failing) { failing = true; text(); } } },
      { t: 'btn', id: 'rs', label: 'Volver a colgar', on: reset },
      { t: 'note', text: 'Todo lo que se cuelga, puede caer: asegura cada foco con su cable y comprueba qué pasa si falla la garra.' }]
  };
};

/* ── 14 · Mesa DMX virtual ── */
SCENES.mesa = (st, ui) => {
  st.setHaze(.55);
  st.setView({ theta: .2, phi: 1.25, r: 13, target: [0, 2.4, 0] }, true);
  const FN = { par: ['Dimmer', 'Rojo', 'Verde', 'Azul'], wash: ['Dimmer', 'Pan', 'Tilt', 'Rojo', 'Verde', 'Azul'] };
  const P = [
    { n: 'PAR 1', t: 'par', x: -4.5, a: 1 }, { n: 'PAR 2', t: 'par', x: -1.5, a: 5 }, { n: 'Wash 1', t: 'wash', x: 1.5, a: 9 }, { n: 'Wash 2', t: 'wash', x: 4.5, a: 15 }];
  P.forEach(p => { p.fx = st.fixture(p.t, { pos: [p.x, 5.5, -1], angle: p.t === 'par' ? 36 : 30, pen: p.t === 'par' ? .2 : .6, lm: 24 }); p.fx.aim(p.x, 0, 1.6, true); st.label(p.n, [p.x, 4.75, -1], { h: .32 }); });
  const dmx = new Array(514).fill(0);
  [255, 255, 80, 0, 255, 0, 90, 255, 200, 90, 150, 0, 255, 120, 200, 170, 150, 255, 0, 200].forEach((v, i) => { dmx[1 + i] = v; });
  const S = { page: 1 };
  const apply = () => {
    P.forEach(p => {
      const v = i => (p.a + i <= 512 ? dmx[p.a + i] : 0) / 255, n = FN[p.t].length;
      if (p.t === 'par') p.fx.set({ dim: v(0), rgb: [v(1), v(2), v(3)] });
      else { p.fx.set({ dim: v(0), rgb: [v(3), v(4), v(5)] }); p.fx.panGoal = rad(v(1) * 540 - 270); p.fx.tiltGoal = rad(-90 + (v(2) * 270 - 135)); }
    });
  };
  const owners = c => P.filter(p => c >= p.a && c < p.a + FN[p.t].length).map(p => `${p.n} · ${FN[p.t][c - p.a]}`);
  const conflict = p => P.some(q => q !== p && p.a < q.a + FN[q.t].length && q.a < p.a + FN[p.t].length);
  const renderPatch = () => {
    ui.html('patch', `<div class="tbl-wrap" style="margin:0"><table class="tbl dmxtbl" style="min-width:0"><thead><tr><th>Fixture</th><th>Modo</th><th>Dirección</th><th>Ocupa</th></tr></thead><tbody>${P.map((p, i) => `<tr><td>${p.n}</td><td>${FN[p.t].length} ch</td><td><input type="number" min="1" max="512" value="${p.a}" data-i="${i}" aria-label="Dirección de ${p.n}" style="width:76px"></td><td>${p.a}–${p.a + FN[p.t].length - 1}${conflict(p) ? ' <b style="color:var(--bad)">⚠ se pisa</b>' : ''}</td></tr>`).join('')}</tbody></table></div>`);
    ui.el('patch').querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => { P[+inp.dataset.i].a = clamp(Math.round(+inp.value) || 1, 1, 512); renderPatch(); renderRows(); apply(); }));
  };
  const renderRows = () => {
    let h = '';
    for (let c = S.page; c < S.page + 16 && c <= 512; c++) {
      const o = owners(c);
      h += `<div class="frow"><span class="mono">CH ${c}</span><input type="range" min="0" max="255" value="${dmx[c]}" data-c="${c}" aria-label="Canal ${c}"><span class="mono val">${dmx[c]}</span><span class="own${o.length > 1 ? ' bad' : ''}">${o.length ? o.join(' + ') : '—'}</span></div>`;
    }
    ui.html('rows', h);
    ui.el('rows').querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { dmx[+inp.dataset.c] = +inp.value; inp.nextElementSibling.textContent = inp.value; apply(); }));
  };
  const refresh = () => { renderPatch(); renderRows(); apply(); ui.hud('<b>Universo 1</b><span>canales ' + S.page + '–' + Math.min(512, S.page + 15) + '</span>'); };
  return {
    refresh, controls: [
      { t: 'html', id: 'patch', html: '' },
      { t: 'range', id: 'pg', label: 'Canales mostrados desde', min: 1, max: 497, step: 8, v: 1, fmt: v => `${v}–${Math.min(512, v + 15)}`, on: v => { S.page = v; refresh(); } },
      { t: 'html', id: 'rows', html: '' },
      { t: 'note', text: 'Cambia la dirección de un foco y mira qué canales lee. Si dos focos se pisan, reciben los mismos datos.' }]
  };
};

WIDGETS.cabeza = el => {
  const COL = [['Blanco', 0, [255, 240, 215]], ['Rojo', 10, [255, 70, 55]], ['Azul', 20, [70, 120, 255]], ['Verde', 30, [70, 230, 120]], ['Ámbar', 40, [255, 170, 45]], ['Magenta', 50, [240, 70, 205]]];
  const GOB = [['Abierto', 0], ['Puntos', 10], ['Estrella', 20], ['Líneas', 30]];
  const S = { dim: 255, pan: 90, tilt: 160, zoom: 100, iris: 255, focus: 128, frost: 0, color: 0, gobo: 0, prism: 0 };
  const chips = (id, arr, key) => `<div class="btns" id="${id}">${arr.map((c, i) => `<button class="opt" data-v="${c[1]}" aria-pressed="${S[key] === c[1]}">${c[0]}</button>`).join('')}</div>`;

    <div class="stage"><canvas id="cv"></canvas><div class="cap" id="cp"></div></div>
    <div class="ctls">
      ${rng('dim', 'Dimmer', 0, 255, 1, S.dim)}${rng('pan', 'Pan', 0, 255, 1, S.pan)}${rng('tilt', 'Tilt', 0, 255, 1, S.tilt)}
      ${rng('zoom', 'Zoom', 0, 255, 1, S.zoom)}${rng('iris', 'Iris', 0, 255, 1, S.iris)}${rng('focus', 'Focus', 0, 255, 1, S.focus)}${rng('frost', 'Frost', 0, 255, 1, S.frost)}
    </div>
    <div class="ctls">
      <div><span class="ctl-l">Color (rueda, canal discreto)</span>${chips('cc', COL, 'color')}</div>
      <div><span class="ctl-l">Gobo</span>${chips('cg', GOB, 'gobo')}</div>
      <div><span class="ctl-l">Prisma</span><div class="btns" id="cpz"><button class="opt" data-v="0" aria-pressed="true">Fuera</button><button class="opt" data-v="10" aria-pressed="false">Dentro (3 haces)</button></div></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="ctl-l" for="base">Dirección DMX del foco</label><input type="number" id="base" min="1" max="503" value="1"></div>
    <div class="tbl-wrap"><table class="tbl dmxtbl"><thead><tr><th>Canal</th><th>Función</th><th>Valor</th><th>Equivale a</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const q = s => el.querySelector(s);
  const cv = q('#cv'), W = 560, H = 330, ctx = setupCanvas(cv, W, H);
  const PX = 34, HH = 6, CX = 280, CY = 165;
  const cname = (arr, v) => { let n = arr[0][0]; arr.forEach(c => { if (v >= c[1]) n = c[0]; }); return n; };

  const spot = (cxp, cyp, a, b, rot, sc, am, soft, rgb, gobo) => {
    ctx.save(); ctx.translate(cxp, cyp); ctx.rotate(rot); ctx.scale(a * PX * sc, b * PX * sc);
    const c = al => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${al})`;
    if (gobo === 0) {
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      g.addColorStop(0, c(.95 * am)); g.addColorStop(clamp(1 - soft, 0.01, .99), c(.85 * am)); g.addColorStop(1, c(0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0, 0, 1, 0, 7); ctx.clip();
      ctx.fillStyle = c(.95 * am); ctx.shadowColor = c(.95 * am); ctx.shadowBlur = 2 + soft * 28;
      if (gobo === 10) [[0, 0], [1, 0], [-1, 0], [.5, .87], [-.5, .87], [.5, -.87], [-.5, -.87]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x * .5, y * .5, .14, 0, 7); ctx.fill(); });
      else if (gobo === 20) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? .36 : .9, an = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } ctx.closePath(); ctx.fill(); }
      else [-.72, -.36, 0, .36, .72].forEach(x => ctx.fillRect(x - .06, -1, .12, 2));
    }
    ctx.restore();
  };

  const draw = () => {
    const phi = rad(S.pan / 255 * 540 - 270), tau = S.tilt / 255 * 270 - 135, tauA = Math.abs(tau), sg = tau < 0 ? -1 : 1;
    const al = rad((5 + S.zoom / 255 * 45) / 2), irisF = .12 + .88 * S.iris / 255;
    const dir = [Math.sin(phi) * sg, Math.cos(phi) * sg];
    ctx.fillStyle = '#07080d'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0f131c'; ctx.fillRect(CX - 6 * PX, CY - 3.5 * PX, 12 * PX, 7 * PX);
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
    for (let m = -8; m <= 8; m++) { ctx.beginPath(); ctx.moveTo(CX + m * PX, 0); ctx.lineTo(CX + m * PX, H); ctx.stroke(); }
    for (let m = -5; m <= 5; m++) { ctx.beginPath(); ctx.moveTo(0, CY + m * PX); ctx.lineTo(W, CY + m * PX); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.strokeRect(CX - 6 * PX, CY - 3.5 * PX, 12 * PX, 7 * PX);
    ctx.fillStyle = '#8d97ad'; ctx.font = '11px IBM Plex Mono, monospace'; ctx.textAlign = 'center';
    ctx.fillText('FONDO', CX, 14); ctx.fillText('PÚBLICO', CX, H - 6);
    const rgb = COL.find(c => c[1] === S.color)[2];
    let msg;
    if (S.dim === 0) msg = 'Dimmer a 0: el foco no emite luz.';
    if (tauA < 84) {
      const ta = rad(tauA);
      let r2 = Math.min(HH * Math.tan(Math.min(ta + al, rad(84))), 14), r1 = Math.min(HH * Math.tan(ta - al), r2 - .05);
      const rc = (r1 + r2) / 2, a = Math.max(.05, (r2 - r1) / 2 * irisF), b = Math.max(.05, HH / Math.cos(ta) * Math.tan(al) * irisF);
      const px = CX + dir[0] * rc * PX, py = CY + dir[1] * rc * PX, rot = Math.atan2(dir[1], dir[0]);
      const soft = clamp(.05 + S.frost / 255 * .95 + Math.abs(S.focus - 128) / 128 * .5, .02, 1);
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(px, py); ctx.stroke(); ctx.setLineDash([]);
      if (S.dim > 0) {
        const am = S.dim / 255, prism = S.prism > 0;
        spot(px, py, a, b, rot, 1, am * (prism ? .8 : 1), soft, rgb, S.gobo);
        if (prism) [-1, 1].forEach(sgn => {
          const off = 2.1 * b * sgn, ox = px + Math.cos(rot + Math.PI / 2) * off * PX, oy = py + Math.sin(rot + Math.PI / 2) * off * PX;
          spot(ox, oy, a, b, rot, .78, am * .65, soft, rgb, S.gobo);
        });
      }
      msg = msg || 'Spot en el suelo: ' + nf(2 * b, 1) + ' m de ancho aprox.';
    } else {
      ctx.strokeStyle = 'rgba(255,176,74,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX + dir[0] * 140, CY + dir[1] * 140); ctx.stroke(); ctx.lineWidth = 1;
      msg = msg || 'El haz queda casi horizontal o apunta hacia arriba: no toca el suelo.';
    }
    ctx.fillStyle = '#1b2030'; ctx.beginPath(); ctx.arc(CX, CY, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#ffb04a'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    q('#cp').textContent = 'Vista desde arriba · el foco cuelga a 6 m en el centro. ' + msg;

    const base = clamp(parseInt(q('#base').value) || 1, 1, 503);
    const rows = [
      ['Dimmer', S.dim, nf(S.dim / 255 * 100, 0) + ' %'],
      ['Pan', S.pan, nf(S.pan / 255 * 540 - 270, 0) + '° (de −270° a +270°)'],
      ['Tilt', S.tilt, nf(S.tilt / 255 * 270 - 135, 0) + '° (0° = vertical)'],
      ['Color', S.color, cname(COL, S.color) + ' (rango de ' + S.color + ')'],
      ['Gobo', S.gobo, cname(GOB, S.gobo)],
      ['Prisma', S.prism, S.prism ? 'Dentro' : 'Fuera'],
      ['Zoom', S.zoom, nf(5 + S.zoom / 255 * 45, 0) + '° de apertura'],
      ['Iris', S.iris, nf(S.iris / 255 * 100, 0) + ' % abierto'],
      ['Focus', S.focus, S.focus === 128 ? 'Nítido' : 'Desenfocado'],
      ['Frost', S.frost, nf(S.frost / 255 * 100, 0) + ' %']
    ];
    q('#tb').innerHTML = rows.map((r, i) => `<tr><td>CH ${base + i}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  };
  ['dim', 'pan', 'tilt', 'zoom', 'iris', 'focus', 'frost'].forEach(k => q('#' + k).addEventListener('input', e => { S[k] = +e.target.value; }));
  bindOpts(el, '#cc .opt', v => { S.color = +v; draw(); });
  bindOpts(el, '#cg .opt', v => { S.gobo = +v; draw(); });
  bindOpts(el, '#cpz .opt', v => { S.prism = +v; draw(); });
  q('#base').addEventListener('input', draw);
  bindRanges(el, {
    dim: v => nf(v / 255 * 100) + ' %', pan: v => nf(v / 255 * 540 - 270) + '°', tilt: v => nf(v / 255 * 270 - 135) + '°',
    zoom: v => nf(5 + v / 255 * 45) + '°', iris: v => nf(v / 255 * 100) + ' %', focus: v => v === 128 ? 'nítido' : v, frost: v => nf(v / 255 * 100) + ' %'
  }, draw);
};

    BARS.forEach(b => { s += `<line x1="40" y1="${b[1]}" x2="580" y2="${b[1]}" stroke="#46506a" stroke-width="3"/><text x="46" y="${b[1] - 8}" fill="#8d97ad" font-size="10" font-family="IBM Plex Mono,monospace">${b[0].toUpperCase()}</text>`; });
    list.forEach((f, i) => { s += SY[f.t][1](f.x, f.y) + `<text x="${f.x}" y="${f.y + 22}" text-anchor="middle" font-size="10" fill="#e8ebf4" font-family="IBM Plex Mono,monospace">${i + 1}</text>`; });
