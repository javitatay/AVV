/* ── 14a · Valor DMX ↔ % ── */
WIDGETS.dmxValor = el => {
  const WHEEL = [[0, 10, 'Rojo', '#ff4a3d'], [11, 20, 'Azul', '#4a7dff'], [21, 30, 'Verde', '#3fd27c'], [31, 40, 'Ámbar', '#ffae2e'], [41, 50, 'Magenta', '#e44bc2'], [51, 60, 'Blanco', '#fff1d8']];
  el.innerHTML = `
    <div class="ctls">${rng('v', 'Canal continuo (dimmer)', 0, 255, 1, 128)}<label class="ctl"><span class="ctl-l">Porcentaje</span><input type="number" id="pc" min="0" max="100" step="0.1" value="50.2"></label></div>
    <div class="bits" id="bits"></div>
    <div class="swatch" id="lamp" style="height:46px"></div>
    <div class="btns" id="qk"><button class="opt" data-v="0" aria-pressed="false">0 %</button><button class="opt" data-v="128" aria-pressed="false">50 %</button><button class="opt" data-v="255" aria-pressed="false">100 %</button></div>
    <p class="note" id="half"></p>
    <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:6px 0">
    ${rng('wh', 'Canal discreto (rueda de color, ejemplo)', 0, 70, 1, 5)}
    <div class="swatch" id="wsw" style="height:46px"></div>
    <p class="note" id="wn"></p>`;
  const q = s => el.querySelector(s);
  const setV = v => {
    v = clamp(Math.round(v), 0, 255);
    q('#v').value = v; q('#v-o').textContent = v;
    q('#pc').value = nf(v / 255 * 100, 1).replace(',', '.');
    const b = v.toString(2).padStart(8, '0');
    q('#bits').innerHTML = [...b].map(x => `<span class="${x === '1' ? 'on' : ''}">${x}</span>`).join('');
    q('#lamp').style.background = `rgb(${Math.round(255 * v / 255)},${Math.round(226 * v / 255)},${Math.round(160 * v / 255)})`;
    q('#half').textContent = `Valor ${v} = ${nf(v / 255 * 100, 1)} %. Dimmer al 50 % = 127,5: según la mesa se envía 127 o 128.`;
  };
  q('#v').addEventListener('input', e => setV(+e.target.value));
  q('#pc').addEventListener('input', e => setV((+e.target.value || 0) / 100 * 255));
  bindOpts(el, '#qk .opt', v => setV(+v));
  bindRanges(el, { wh: v => v }, () => {
    const v = +q('#wh').value, w = WHEEL.find(r => v >= r[0] && v <= r[1]);
    q('#wsw').style.background = w ? w[3] : 'var(--stage)';
    q('#wn').textContent = w ? `Valor ${v}: ${w[2]} (rango ${w[0]}–${w[1]}). Dentro del rango no cambia nada.` : `Valor ${v}: sin función definida en este ejemplo.`;
  });
  setV(128);
};

/* ── 14b · DIP binario ── */
WIDGETS.dip = el => {
  const bits = Array(9).fill(false); bits[0] = true; bits[2] = true; bits[5] = true; // 1+4+32 = 37
  el.innerHTML = `<div class="dip" id="dp">${bits.map((_, i) => `<button class="sw" data-i="${i}" aria-pressed="${bits[i]}" aria-label="Interruptor ${i + 1}, vale ${1 << i}"><i></i><span>${1 << i}</span></button>`).join('')}</div>
    <div class="reads"><div class="read hot"><b id="ad"></b><span>Dirección</span></div><div class="read"><b id="oc"></b><span>Canales ocupados</span></div></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="ctl-l" for="nc">Canales del modo del foco</label><input type="number" id="nc" min="1" max="512" value="16"></div>
    <p class="note" id="wr"></p>`;
  const q = s => el.querySelector(s);
  const upd = () => {
    const a = bits.reduce((s, b, i) => s + (b ? 1 << i : 0), 0), n = clamp(+q('#nc').value || 1, 1, 512), end = a + n - 1;
    q('#ad').textContent = a; q('#oc').textContent = a ? `${a} – ${end}` : '—';
    q('#wr').textContent = a === 0 ? 'Con todos los interruptores abajo la dirección es 0, que no es válida en la mayoría de focos (rango 1–512).' : end > 512 ? `El foco necesita hasta el canal ${end}: no cabe en el universo (máximo 512). Cambia la dirección.` : 'Cabe en el universo.';
  };
  el.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i; bits[i] = !bits[i]; b.setAttribute('aria-pressed', bits[i]); upd(); }));
  q('#nc').addEventListener('input', upd);
  upd();
};

/* ── 14c · Patch ── */
WIDGETS.patch = el => {
  const PRE = [['PAR LED', 6], ['Wash LED', 16], ['Spot', 24], ['Beam', 20], ['Pixel bar', 48]];
  let fx = [];
  const add = (n, ch, k) => { for (let i = 0; i < k; i++) fx.push({ n, ch }); };
  add('Wash LED', 16, 10); add('Spot', 24, 8); add('PAR LED', 6, 12);
  el.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="pr" aria-label="Tipo de foco">${PRE.map((p, i) => `<option value="${i}">${p[0]} · ${p[1]} canales</option>`).join('')}</select>
      <label class="ctl-l" for="qt">Cantidad</label><input type="number" id="qt" min="1" max="50" value="1">
      <button class="btn small" id="ad">Añadir</button><button class="btn small" id="cl">Vaciar</button>
    </div>
    <div class="reads"><div class="read"><b id="s1"></b><span>Focos</span></div><div class="read"><b id="s2"></b><span>Canales usados</span></div><div class="read hot"><b id="s3"></b><span>Universos necesarios</span></div></div>
    <div class="tbl-wrap" style="max-height:300px;overflow:auto"><table class="tbl dmxtbl"><thead><tr><th>ID</th><th>Fixture</th><th>Modo</th><th>Universo</th><th>Dirección</th><th>Ocupa</th></tr></thead><tbody id="tb"></tbody></table></div>
    <p class="note">Los modos de canales son ejemplos. En la práctica los define la librería de cada foco.</p>`;
  const q = s => el.querySelector(s);
  const render = () => {
    let a = 1, u = 1, used = 0; const rows = [];
    fx.forEach((f, i) => {
      if (a + f.ch - 1 > 512) { u++; a = 1; }
      rows.push(`<tr><td>${i + 1}</td><td>${f.n}</td><td>${f.ch} ch</td><td>${u}</td><td>${a}</td><td>${a}–${a + f.ch - 1}</td></tr>`);
      a += f.ch; used += f.ch;
    });
    q('#tb').innerHTML = rows.join('') || '<tr><td colspan="6" class="note">Añade focos para repartirlos.</td></tr>';
    q('#s1').textContent = fx.length; q('#s2').textContent = nf(used); q('#s3').textContent = fx.length ? u : 0;
  };
  q('#ad').addEventListener('click', () => { const p = PRE[+q('#pr').value]; add(p[0], p[1], clamp(+q('#qt').value || 1, 1, 50)); render(); });
  q('#cl').addEventListener('click', () => { fx = []; render(); });
  render();
};

/* ── 15 · Topología de la señal ── */
WIDGETS.topologia = el => {
  const MODES = {
    cas: {
      label: 'En cascada', note: 'Un solo cable recorre todos los focos: un corte apaga todo lo que queda detrás.',
      nodes: { C: [50, 100], F1: [160, 100], F2: [250, 100], F3: [340, 100], F4: [430, 100], F5: [520, 100] },
      edges: [['C', 'F1'], ['F1', 'F2'], ['F2', 'F3'], ['F3', 'F4'], ['F4', 'F5']]
    },
    spl: {
      label: 'Con splitter', note: 'Cada salida del splitter es una línea independiente: un corte solo afecta a su rama.',
      nodes: { C: [40, 100], S: [130, 100], F1: [250, 38], F2: [350, 38], F3: [250, 100], F4: [350, 100], F5: [250, 162] },
      edges: [['C', 'S'], ['S', 'F1'], ['F1', 'F2'], ['S', 'F3'], ['F3', 'F4'], ['S', 'F5']]
    },
    nod: {
      label: 'Con nodo Art-Net', note: 'La mesa llega por Ethernet (RJ45) al nodo, que saca varias líneas DMX independientes.',
      nodes: { C: [40, 100], S: [130, 100], F1: [250, 38], F2: [350, 38], F3: [250, 100], F4: [350, 100], F5: [250, 162] },
      edges: [['C', 'S'], ['S', 'F1'], ['F1', 'F2'], ['S', 'F3'], ['F3', 'F4'], ['S', 'F5']]
    }
  };
  let mode = 'cas', cut = new Set();
  el.innerHTML = `<div class="btns" id="md">${Object.entries(MODES).map(([k, m]) => `<button class="opt" data-v="${k}" aria-pressed="${k === mode}">${m.label}</button>`).join('')}<button class="btn small" id="rs" style="margin-left:auto">Reparar cables</button></div>
    <div class="stage"><svg viewBox="0 0 560 200" id="sv" role="img" aria-label="Esquema de conexión DMX"></svg><div class="cap" id="cp"></div></div>`;
  const q = s => el.querySelector(s);
  const draw = () => {
    const m = MODES[mode], alive = new Set(['C']);
    let ch = true;
    while (ch) { ch = false; m.edges.forEach((e, i) => { if (!cut.has(i) && alive.has(e[0]) && !alive.has(e[1])) { alive.add(e[1]); ch = true; } }); }
    let s = '';
    m.edges.forEach((e, i) => {
      const a = m.nodes[e[0]], b = m.nodes[e[1]], isNet = mode === 'nod' && i === 0, col = cut.has(i) ? '#ff6a55' : isNet ? '#7ea6ff' : '#8d97ad';
      s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="${isNet ? 4 : 3}" ${cut.has(i) ? 'stroke-dasharray="5 6"' : ''}/>`;
      s += `<line data-e="${i}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="transparent" stroke-width="22" style="cursor:pointer"><title>Cortar o reparar este cable</title></line>`;
      if (cut.has(i)) s += `<text x="${(a[0] + b[0]) / 2}" y="${(a[1] + b[1]) / 2 - 8}" text-anchor="middle" font-size="14" fill="#ff6a55" pointer-events="none">✂</text>`;
    });
    Object.entries(m.nodes).forEach(([k, p]) => {
      if (k === 'C') s += `<rect x="${p[0] - 24}" y="${p[1] - 16}" width="48" height="32" rx="6" fill="#1b2030" stroke="#ffb04a" stroke-width="2"/><text x="${p[0]}" y="${p[1] + 4}" text-anchor="middle" font-size="11" fill="#ffb04a" font-family="IBM Plex Mono,monospace">MESA</text>`;
      else if (k === 'S') s += `<rect x="${p[0] - 24}" y="${p[1] - 16}" width="48" height="32" rx="6" fill="#1b2030" stroke="#7ea6ff" stroke-width="2"/><text x="${p[0]}" y="${p[1] + 4}" text-anchor="middle" font-size="10" fill="#7ea6ff" font-family="IBM Plex Mono,monospace">${mode === 'nod' ? 'NODO' : 'SPLIT'}</text>`;
      else {
        const on = alive.has(k);
        s += `<circle cx="${p[0]}" cy="${p[1]}" r="${on ? 22 : 0}" fill="rgba(255,176,74,.16)"/><circle cx="${p[0]}" cy="${p[1]}" r="12" fill="${on ? '#ffb04a' : '#2a2f3f'}" stroke="${on ? '#ffe3b3' : '#4b546a'}" stroke-width="2"/><text x="${p[0]}" y="${p[1] + 30}" text-anchor="middle" font-size="10" fill="#8d97ad" font-family="IBM Plex Mono,monospace">${k.replace('F', 'Foco ')}</text>`;
      }
    });
    q('#sv').innerHTML = s;
    const dead = Object.keys(m.nodes).filter(k => k[0] === 'F' && !alive.has(k)).length;
    q('#cp').textContent = m.note + (cut.size ? ` · Focos apagados: ${dead} de 5.` : '');
    q('#sv').querySelectorAll('[data-e]').forEach(l => l.addEventListener('click', () => { const i = +l.dataset.e; cut.has(i) ? cut.delete(i) : cut.add(i); draw(); }));
  };
  bindOpts(el, '#md .opt', v => { mode = v; cut = new Set(); draw(); });
  q('#rs').addEventListener('click', () => { cut = new Set(); draw(); });
  draw();
};

(function () {
  const KEY = 'luz-directo-progreso-v1';
  let done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { /* sin almacenamiento */ }

  function shell(current, route) {
    $('#side').innerHTML = '<a class="side-home" href="https://javitatay.github.io/AVV/"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true"><path d="M12 4 6 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Volver a AVV Lab</a>' + [4, 5].map(u => `<h3>${UNITS[u].title}</h3>` + LESSONS.filter(l => l.unit === u).map(l =>
      `<a href="#leccion-${l.n}" ${current === l.n ? 'aria-current="page"' : ''}><span class="num">${l.n}</span><span>${l.title}</span>${done.has(l.n) ? '<span class="tick" aria-label="completada">✓</span>' : ''}</a>`).join('')).join('');
    $('#count').textContent = `${done.size}/${total}`;

  }

  /* ── Visor 3D ── */
  function mountScene(host, key, opts = {}) {

        <div class="frame hero-art"><div class="viewer" id="hero" role="img" aria-label="Escena 3D de cabezas móviles barriendo el escenario"></div></div></section>

    return `<section class="quiz">
      ${l.quiz.map((q, i) => `<div class="q" data-i="${i}"><p>${q.q}</p><div class="answers">${q.o.map((o, j) => `<button class="a" data-j="${j}">${o}</button>`).join('')}</div><p class="why" hidden></p></div>`).join('')}
      <p class="score" id="score" aria-live="polite"></p></section>`;
  }

  function wireQuiz(l) {
    const box = $('.quiz'); if (!box) return;
    let answered = 0, right = 0;
    box.querySelectorAll('.q').forEach(qe => {
      const q = l.quiz[+qe.dataset.i];
      qe.querySelectorAll('.a').forEach(b => b.addEventListener('click', () => {
        const j = +b.dataset.j;
        qe.querySelectorAll('.a').forEach(x => { x.disabled = true; if (+x.dataset.j === q.a) x.classList.add('ok'); });
        if (j !== q.a) b.classList.add('no'); else right++;
        const w = qe.querySelector('.why'); w.hidden = false; w.textContent = (j === q.a ? 'Correcto. ' : 'No es esa. ') + q.why;
        answered++;
        $('#score').textContent = `${right} de ${l.quiz.length} correctas`;
        if (answered === l.quiz.length) { done.add(l.n); save(); markBtn(l); shell(l.n, 'leccion-' + l.n); }
      }));
    });
  }

  function markBtn(l) {
    const b = $('#mark'); if (!b) return;
    const d = done.has(l.n);
    b.textContent = d ? '✓ Completada' : 'Marcar como hecha';
    b.setAttribute('aria-pressed', d);
  }

  function widgetCard(l, key, i) {
    const w = l.widgets.find(x => x.key === key); if (!w) return '';
    return `<section class="widget" aria-label="${w.title}"><header><div class="wtag">Simulador</div><h3>${w.title}</h3><p class="wnote">${w.note}</p></header><div class="wbody" data-w="${key}"></div></section>`;
  }
  function runWidgets(root) {
    root.querySelectorAll('[data-w]').forEach(host => {
      try { WIDGETS[host.dataset.w](host); } catch (e) { host.innerHTML = '<p class="note">No se ha podido cargar este simulador.</p>'; console.error(host.dataset.w, e); }
    });
  }

  /* ── Lección ── */
  function lesson(n) {
    const l = byN(n); if (!l) return home();
    const M = META[n];
    document.title = `${l.n}. ${l.title} · Iluminación en directo · AVV Lab`;
    shell(n, 'leccion-' + n);
    const prev = byN(n - 1), next = byN(n + 1);
    const use3D = GL && !!M.scene;
    const allKeys = (l.widgets || []).map(w => w.key);
    // qué simuladores 2D se muestran y dónde
    const keys2D = M.scene ? (use3D ? (M.extras || []) : [...(M.fallback || []), ...(M.extras || [])]) : allKeys;
    const bodyInMain = !use3D && !keys2D.length;
    const tabs = [...(use3D ? [['explorar', 'Explorar']] : []), ['ideas', 'Ideas'], ['prueba', 'Prueba'], ...(bodyInMain ? [] : [['apuntes', 'Apuntes']])];
    const first = tabs[0][0];
    $('#view').innerHTML = `<div class="lpage">
      <div class="lhead"><span class="kicker">UD${l.unit} · Lección ${l.n}/${total}</span><h1>${l.title}</h1></div>
      <div class="lgrid">
        <div class="lmain">
          ${use3D ? '<div class="viewer" id="viewer"></div>' : ''}
          ${!use3D && M.scene ? '<p class="note">Tu navegador no puede mostrar la escena 3D (WebGL). Usa los simuladores de abajo.</p>' : ''}
          ${keys2D.length ? `<div class="extras">${keys2D.map((k, i) => widgetCard(l, k, i)).join('')}</div>` : ''}
          ${bodyInMain ? `<div class="prose">${l.body}${l.after || ''}</div>` : ''}
        </div>
        <aside class="dock" aria-label="Panel de la lección">
          <div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" id="t-${t[0]}" aria-controls="p-${t[0]}" aria-selected="${t[0] === first}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
          ${use3D ? '<div class="pane" id="p-explorar" role="tabpanel" aria-labelledby="t-explorar"><div id="ctl"></div></div>' : ''}
          <div class="pane" id="p-ideas" role="tabpanel" aria-labelledby="t-ideas" ${first === 'ideas' ? '' : 'hidden'}><p class="lede2">${l.lede}</p><ul class="keys">${M.bullets.map(b => `<li>${b}</li>`).join('')}</ul></div>
          <div class="pane" id="p-prueba" role="tabpanel" aria-labelledby="t-prueba" hidden>${quizHTML(l)}</div>
          ${bodyInMain ? '' : `<div class="pane" id="p-apuntes" role="tabpanel" aria-labelledby="t-apuntes" hidden><div class="prose">${l.body}${l.after || ''}</div></div>`}
          <div class="dockfoot">${prev ? `<a class="btn small" href="#leccion-${prev.n}" aria-label="Lección anterior">←</a>` : '<span></span>'}<button class="btn small" id="mark" aria-pressed="false"></button>${next ? `<a class="btn small primary" href="#leccion-${next.n}">Siguiente →</a>` : '<a class="btn small primary" href="#inicio">Inicio</a>'}</div>
        </aside></div></div>`;
    window.scrollTo(0, 0);

    // pestañas
    const tabEls = [...document.querySelectorAll('.tabs [role=tab]')];
    const showTab = id => {
      tabEls.forEach(t => t.setAttribute('aria-selected', t.dataset.t === id));
      tabs.forEach(t => { const p = $('#p-' + t[0]); if (p) p.hidden = t[0] !== id; });
    };
    tabEls.forEach(t => t.addEventListener('click', () => showTab(t.dataset.t)));
    tabEls.forEach((t, i) => t.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const o = tabEls[(i + (e.key === 'ArrowRight' ? 1 : tabEls.length - 1)) % tabEls.length]; o.focus(); showTab(o.dataset.t); }
    }));

    // escena 3D
    if (use3D) {
      const host = $('#viewer');
      try {
        const m = mountScene(host, M.scene);
        buildControls($('#ctl'), m.sc.controls, m.ui);
        m.sc.refresh && m.sc.refresh();
      } catch (e) {
        console.error(e); disposeStage();
        host.outerHTML = '<p class="note">No se ha podido iniciar la escena 3D; se muestran los simuladores 2D.</p>';
        // recurrir a los simuladores 2D de respaldo
        const ex = document.createElement('div'); ex.className = 'extras';
        ex.innerHTML = [...(M.fallback || []), ...(M.extras || [])].map(k => widgetCard(l, k)).join('');
        $('.lmain').appendChild(ex); runWidgets(ex);
        const t = $('#t-explorar'); if (t) { t.remove(); $('#p-explorar').remove(); showTab('ideas'); }
      }
    }
    runWidgets($('.lmain'));
    wireQuiz(l);
    markBtn(l);
    $('#mark').addEventListener('click', () => { done.has(l.n) ? done.delete(l.n) : done.add(l.n); save(); markBtn(l); shell(l.n, 'leccion-' + l.n); });
  }

  function route() {
    disposeStage();
    const h = location.hash.slice(1);
    const m = /^leccion-(\d+)$/.exec(h);
    try {
      if (m) lesson(+m[1]); else if (h === 'componentes') components(); else home();
    } catch (e) { console.error(e); $('#view').innerHTML = '<p class="note" style="padding:24px">Algo ha fallado al cargar esta página. <a href="#inicio">Volver al inicio</a></p>'; }
  }

  $('#menu').addEventListener('click', () => document.body.classList.toggle('menu-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('menu-open'));
  window.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('menu-open'); });
  window.addEventListener('hashchange', route);
  route();
})();

</script>
<script>
(function () {
  var root = document.documentElement, btn = document.getElementById('themeToggle');
  if (!btn) return;
  function current() { return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function refresh() { var next = current() === 'dark' ? 'claro' : 'oscuro'; btn.setAttribute('aria-label', 'Cambiar a modo ' + next); btn.title = 'Cambiar a modo ' + next; }
  btn.hidden = false; refresh();
  btn.addEventListener('click', function () {
    var t = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('avvlab_theme', t); } catch (e) {}
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', t === 'dark' ? '#1b1917' : '#f7f6f3'); });
    refresh();
  });
})();
</script>
</body>
</html>
